name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # The suite and the evaluators are the benchmark's source of truth, so they are
  # gated before anything is published. validate_suite catches fixtures that
  # cannot behave correctly (regexes that match everything, keyword lists that are
  # really alternatives, mismatched expected types); selftest_evaluators asserts
  # that each evaluator rejects a plausible-but-wrong answer and accepts a correct
  # one, including awkward-but-valid forms.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Pin the dependency installer version.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.22'

      - name: Set up Python
        run: uv python install 3.14.8

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Validate the test suite
        run: uv run python validate_suite.py --strict

      - name: Self-test the evaluators
        run: uv run python selftest_evaluators.py

      - name: Verify criterion-level evaluation diagnostics
        run: uv run python selftest_granular.py

      - name: Verify rigorous challenges and precision regressions
        run: uv run python selftest_rigorous.py

      - name: Verify challenge answers and reject near misses
        run: uv run python selftest_challenges.py

      - name: Verify specialist answers, translations, and repository reviews
        run: uv run python selftest_specialists.py

      - name: Verify database JSON regressions and ceiling challenges
        run: uv run python selftest_ceiling.py

      - name: Verify stretch answer keys and grading regressions
        run: uv run python selftest_stretch.py

      - name: Verify generated, interactive, and long-context evaluation
        run: uv run python selftest_quality.py

      - name: Verify saved answers and benchmark failure reporting
        run: uv run python selftest_benchmark_runner.py

      - name: Verify bounded recovery and model decoding configuration
        run: uv run python selftest_protocol.py

      - name: Verify fixed performance measurements
        run: |
          uv run python selftest_perf.py
          uv run python selftest_sweep.py
          uv run python selftest_telemetry.py
          uv run python selftest_cache.py
          uv run python selftest_storage.py

      - name: Verify independent v10 oracles and review regressions
        run: uv run python selftest_frontier.py

      - name: Verify adversarial v11 tasks and client measurement protocol
        run: |
          uv run python selftest_adversarial.py
          uv run python selftest_client.py

      - name: Verify v12 concurrency and nested knowledge with independent oracles
        run: uv run python selftest_compositional.py

      - name: Verify v13 evidence sufficiency, tool traces and grading regressions
        run: uv run python selftest_evidence.py

      - name: Verify v14 inference, ambiguity, execution and atomic grading
        run: uv run python selftest_reasoning.py

      - name: Verify empirical calibration and original behavioral reconstruction
        run: |
          uv run python selftest_calibration.py
          uv run python selftest_reconstruction.py

      - name: Verify portable HTML reports and comparisons
        run: uv run python selftest_reports.py

      - name: Verify simplified run options and queue lifecycle
        run: |
          uv run python selftest_run_options.py
          uv run python selftest_run_queue.py

      - name: Lint
        run: uv run --frozen ruff check .

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
