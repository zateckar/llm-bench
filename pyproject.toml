[project]
name = "llm-bench"
version = "0.2.0"
description = "LLM quality and accuracy benchmarking web application"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1.6",
    "aiosqlite>=0.22.1",
    "itsdangerous>=2.2.0",
    "bcrypt>=5.0.0",
    "python-jose[cryptography]>=3.5.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "urllib3>=2.8.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "ruff>=0.16.10",
]

[tool.ruff]
# Pinned explicitly so `ruff check .` means the same thing locally and in CI, and
# does not start failing the build when a new ruff release changes its defaults.
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The routers are imported after the middleware is registered, which is the
# documented FastAPI pattern and cannot be hoisted to the top of the module.
"app/main.py" = ["E402"]
