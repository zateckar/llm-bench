[project]
name = "llm-bench"
version = "0.1.0"
description = "LLM quality and accuracy benchmarking web application"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "aiosqlite>=0.20.0",
    "itsdangerous>=2.2.0",
    "bcrypt>=4.2.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
bench = "app.main:app"

[tool.ruff]
# Pinned explicitly so `ruff check .` means the same thing locally and in CI, and
# does not start failing the build when a new ruff release changes its defaults.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The routers are imported after the middleware is registered, which is the
# documented FastAPI pattern and cannot be hoisted to the top of the module.
"app/main.py" = ["E402"]
# The shared benchmark modules live at the repo root and are imported after
# sys.path is extended, so the app works from any working directory.
"app/services/benchmark_runner.py" = ["E402"]
