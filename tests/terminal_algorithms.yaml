      expected: 1
    - function: knight_moves
      args: ["a1", "c2"]
      expected: 1
    - function: knight_moves
      args: ["a1", "b2"]
      expected: 4
    - function: knight_moves
      args: ["a1", "d4"]
      expected: 2
    - function: knight_moves
      args: ["a1", "h8"]
      expected: 6

