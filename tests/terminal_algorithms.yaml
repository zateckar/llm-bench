# Terminal Algorithms Test Suite
#
# The previous version graded these with `multi_step_solution` against patterns
# like "target|append|return" and "path|return \[\]|append". Any plausible-looking
# Python matched, and a step found out of order still earned half credit, so the
# category passed on prose alone. Every item here now runs the model's code
# against fixtures with a known correct answer.

- id: TA-01
  category: Terminal Algorithms
  difficulty: hard
  source: terminal-bench/countdown-game
  prompt: |
    Solve the Countdown numbers game. Write a Python function
    `countdown_reachable(target: int, numbers: list[int]) -> bool`
    that returns True if and only if `target` can be produced from a subset of `numbers`
    using the operators +, -, * and / (each number used at most once). Division is only
    permitted when it divides exactly, and intermediate values must stay positive integers.
    A single number on its own counts as an expression.
    Reply with ONLY the Python code in a code block.
  evaluator: code_exec
  expected:
    - function: countdown_reachable
      args: [952, [75, 8, 3, 7, 2, 1]]
      expected: true
    - function: countdown_reachable
      args: [11, [1, 1]]
      expected: false
    - function: countdown_reachable
      args: [100, [10, 10]]
      expected: true
    - function: countdown_reachable
      args: [1, [2]]
      expected: false
    - function: countdown_reachable
      args: [24, [4, 6]]
      expected: true
    - function: countdown_reachable
      args: [7, [3, 7, 5]]
      expected: true

