# Factual Knowledge Test Suite
#
# Keyword lists are now strict: a bare list means EVERY entry must appear, and
# alternative spellings are expressed with `groups` (any-of inside a group, all
# groups required). Previously a two-keyword list scored 0.5 for one hit, which
# cleared the old 0.5 pass bar - so naming half the answer counted as correct.

- id: FK-01
  category: Factual Knowledge
  difficulty: medium
  prompt: "Name the mineral that is the primary commercial source of fluorine and crystallises in the isometric (cubic) system, and give its chemical formula."
  evaluator: contains_keywords
  expected:
    groups:
      - ["fluorite", "fluorspar"]
      - ["caf2", "caf₂", "ca f2"]

- id: FK-02
  category: Factual Knowledge
  difficulty: hard
  description: "Multi-hop arithmetic over four separate facts"
  prompt: "Multiply the number of protons in a gold nucleus by the oxidation state of chromium in potassium dichromate, then subtract the mass number of the most abundant carbon isotope. What is the result? Reply with just the number."
  evaluator: numeric_match
  expected: 462.0

- id: FK-03
  category: Factual Knowledge
  difficulty: hard
  prompt: "What is the smallest Sophie Germain prime greater than 100? Reply with just the number."
  evaluator: numeric_match
  expected: 113.0

- id: FK-04
  category: Factual Knowledge
  difficulty: hard
  prompt: "What is the half-life of Uranium-235, expressed in millions of years and rounded to the nearest integer? Reply with just the number."
