- id: FK-21
  category: Factual Knowledge
  difficulty: hard
  prompt: "Name the metal with the highest melting point of any metallic element, and give that melting point in degrees Celsius rounded to the nearest 10."
  evaluator: contains_keywords
  expected:
    all: ["tungsten"]
    groups:
      - ["3420", "3422", "3410", "3430"]

- id: FK-22
  category: Factual Knowledge
  difficulty: hard
  description: "Multi-part factual recall; all three sub-answers required"
  prompt: |
    Answer all three, then end your reply with a single line in exactly this format:
    `ANSWERS: <a>, <b>, <c>`

    (a) In which year did Alan Turing publish the paper proving the halting problem undecidable?
    (b) Which moon of Saturn vents plumes of water ice from its south polar region?
    (c) What is the SI derived unit of magnetic flux?
  evaluator: regex_all
  expected:
    patterns:
      - '(?im)^\s*ANSWERS:\s*1936\s*,\s*Enceladus\s*,\s*[Ww]eber\s*\.?\s*$'
