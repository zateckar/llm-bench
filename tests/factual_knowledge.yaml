# Factual Knowledge Test Suite
#
# Keyword lists are now strict: a bare list means EVERY entry must appear, and
# alternative spellings are expressed with `groups` (any-of inside a group, all
# groups required). Previously a two-keyword list scored 0.5 for one hit, which
# cleared the old 0.5 pass bar - so naming half the answer counted as correct.

- id: FK-01
  category: Factual Knowledge
  difficulty: medium
  prompt: "Name the mineral that is the primary commercial source of fluorine and crystallises in the isometric (cubic) system, and give its chemical formula."
  evaluator: contains_keywords
  expected:
    groups:
      - ["fluorite", "fluorspar"]
      - ["caf2", "caf₂", "ca f2"]

- id: FK-02
  category: Factual Knowledge
  difficulty: hard
  description: "Multi-hop arithmetic over four separate facts"
  prompt: "Multiply the number of protons in a gold nucleus by the oxidation state of chromium in potassium dichromate, then subtract the mass number of the most abundant carbon isotope. What is the result? Reply with just the number."
  evaluator: numeric_match
  expected: 462.0

- id: FK-03
  category: Factual Knowledge
  difficulty: hard
  prompt: "What is the smallest Sophie Germain prime greater than 100? Reply with just the number."
  evaluator: numeric_match
  expected: 113.0

- id: FK-04
  category: Factual Knowledge
  difficulty: hard
  prompt: "What is the half-life of Uranium-235, expressed in millions of years and rounded to the nearest integer? Reply with just the number."
  evaluator: numeric_match
  expected: 704.0

- id: FK-05
  category: Factual Knowledge
  difficulty: medium
  prompt: "One country's national flag depicts a modern firearm. Name the country and the specific weapon shown."
  evaluator: contains_keywords
  expected:
    all: ["mozambique"]
    groups:
      - ["ak-47", "ak47", "kalashnikov"]

- id: FK-06
  category: Factual Knowledge
  difficulty: hard
  prompt: "Name the deepest oceanic trench in the Atlantic Ocean and the name of its deepest point."
  evaluator: contains_keywords
  expected:
    all: ["puerto rico", "milwaukee"]

- id: FK-07
  category: Factual Knowledge
  difficulty: hard
  prompt: "Which is the heaviest element with at least one observationally stable (non-radioactive) isotope? Name the element and give its atomic number."
  evaluator: contains_keywords
  expected:
    all: ["lead", "82"]

- id: FK-08
  category: Factual Knowledge
  difficulty: hard
  prompt: "Two chemical elements are liquid at 25 degrees Celsius and 1 atmosphere. Name both."
  evaluator: contains_keywords
  expected:
    all: ["mercury", "bromine"]

- id: FK-09
  category: Factual Knowledge
  difficulty: hard
  prompt: "What is the name of the smallest non-abelian simple group, and what is its order? Give both."
  evaluator: contains_keywords
  expected:
    all: ["60"]
    groups:
      - ["a5", "a_5", "alternating group", "icosahedral"]

- id: FK-10
  category: Factual Knowledge
  difficulty: medium
  prompt: "Which moon in the Solar System is the only one known to have both a dense atmosphere and stable liquid lakes on its surface? Name the moon and the main liquid in those lakes."
  evaluator: contains_keywords
  expected:
    all: ["titan"]
    groups:
      - ["methane", "ethane", "hydrocarbon"]

- id: FK-11
  category: Factual Knowledge
  difficulty: medium
  prompt: "What is the name of the constant defined as the limiting difference between the harmonic series and the natural logarithm, approximately 0.5772?"
  evaluator: contains_keywords
  expected:
    groups:
      - ["euler-mascheroni", "euler mascheroni", "euler's constant", "eulers constant", "mascheroni"]

- id: FK-12
  category: Factual Knowledge
  difficulty: hard
  prompt: "What is the reciprocal of the fine-structure constant, rounded to the nearest integer? Reply with just the number."
  evaluator: numeric_match
  expected: 137.0

- id: FK-13
  category: Factual Knowledge
  difficulty: hard
  prompt: "What is the Chandrasekhar limit, in solar masses, rounded to one decimal place? Reply with just the number."
  evaluator: numeric_match
  expected: 1.4

- id: FK-14
  category: Factual Knowledge
  difficulty: medium
  prompt: "What is the name of the theorem in topology stating that any simple closed curve in the plane divides the plane into exactly two connected regions?"
  evaluator: contains_keywords
  expected:
    all: ["jordan"]
    groups:
      - ["curve theorem", "curve"]

- id: FK-15
  category: Factual Knowledge
  difficulty: hard
  prompt: "Give the exact closed-form value of the Riemann zeta function at s = 2."
  evaluator: regex_all
  expected:
    patterns:
      - '(?i)(pi\s*\^?\s*2\s*/\s*6|π\s*\^?\s*2\s*/\s*6|\\frac\{\\?pi\^?2?\}\{6\}|\\pi\^2\s*/\s*6|π²\s*/\s*6|pi squared (?:divided by|over) six)'

- id: FK-16
  category: Factual Knowledge
  difficulty: hard
  description: "Requires the number, not just the mechanism"
  prompt: "How many code points does the Unicode codespace contain in total? Reply with just the number."
  evaluator: numeric_match
  expected: 1114112.0

- id: FK-17
