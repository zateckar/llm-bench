- id: H5-TN-randomization-02
  category: Terminal Science
  difficulty: expert
  max_tokens: 16384
  source: 'Original ceiling-v5; BBEH: https://github.com/google-deepmind/bbeh (compositional reasoning
    design only)'
  description: Compositional challenge; deterministic oracle in hard_cases.py. Difficulty awaits fresh
    model calibration.
  prompt: 'A paired randomized experiment has eight independently randomized blocks.

    The observed treatment-minus-control differences are [1, -8, 4, -1, 9, 9, 7, 1]; PRE-SPECIFIED

    integer weights are [3, 2, 2, 3, 2, 2, 3, 1]. Test statistic is the absolute weighted SUM, not a

    mean of signs. Under the sharp null, independently swap treatment/control labels in

    each block: all 256 sign-flip vectors are equally likely, even when vectors yield

    the same statistic. Exact two-sided p is proportion with statistic >= observed.

    Count ties as extreme; do not add an extra pseudo-observation. Each block contains

    100 repeated measurements, which do not increase the number of randomized blocks.

    Return {"independent_units":integer,"observed_statistic":integer,"extreme_vectors":integer,

    "p":{"numerator":integer,"denominator":integer},"reject_at_0_05":bool,

    "causal_effect_in_unstudied_population_established":bool}. Reduce p. No transportability

    assumptions or data about any other population are supplied.

    Return only the requested JSON, with no extra keys or prose. Null is allowed only where explicitly
    requested. All ID lists must be sorted lexicographically.'
  evaluator: json_match
  expected:
    value:
      independent_units: 8
      observed_statistic: 50
      extreme_vectors: 48
      p:
        numerator: 3
        denominator: 16
      reject_at_0_05: false
      causal_effect_in_unstudied_population_established: false
    mode: exact
    strict_json: true
- id: H5-ER-allocation-02
