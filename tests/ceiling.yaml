- id: H5-FK-decay-02
  category: Factual Knowledge
  difficulty: expert
  max_tokens: 16384
  source: 'Original ceiling-v5; BBEH: https://github.com/google-deepmind/bbeh (compositional reasoning
    design only)'
  description: Compositional challenge; deterministic oracle in hard_cases.py. Difficulty awaits fresh
    model calibration.
  prompt: 'Reference-grounded scientific knowledge: a simplified discrete decay chain

    A->B->C conserves nuclei; C is stable. In each step HALF the A present at START

    becomes B, and ONE QUARTER of the B present at START becomes C. Newly created B

    cannot decay again in the same step. Initial (A,B,C)=(384,0,0). These are expected

    populations, so fractional counts are valid. Run five steps. A detector then records

    each C nucleus with efficiency 1/2; it records

