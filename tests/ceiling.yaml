- id: H5-AU-ledger-01
  category: Agentic Use Cases
  difficulty: expert
  max_tokens: 16384
  source: 'Original ceiling-v5; BBEH: https://github.com/google-deepmind/bbeh (compositional reasoning
    design only)'
  description: Compositional challenge; deterministic oracle in hard_cases.py. Difficulty awaits fresh
    model calibration.
  prompt: 'Audit this transactional tool-service event log. Each call commits atomically.

    Initial balances: {"A": 58, "B": 46, "C": 38, "D": 52}; every account version starts at zero.

    Each row is [idempotency_key,source,destination,positive_integer_amount,expected_source_version].

    Apply these checks IN ORDER: (1) if key is already committed, return replay for the

    same (source,destination,amount), otherwise key_conflict; expected version is NOT

    part of this identity. (2) reject stale source version as stale. (3) reject insufficient

    source funds as insufficient. (4) atomically transfer, increment BOTH account versions,

    record the key, and return applied. Rejections do not record keys or change state.

    Rows are the complete serialized execution order, not concurrent starts. An earlier

    failure therefore does not prevent later reuse of its key. No fee or overdraft.

    Events: [["k00", "B", "C", 44, 0], ["k01", "B", "C", 18, 1], ["k02", "A", "C", 58, 0], ["k02", "A",
    "C", 58, 0], ["k04", "D", "A", 60, 0], ["k05", "B", "A", 33, 0], ["k02", "A", "C", 59, 0], ["k07",
    "C", "A", 51, 2], ["k08", "D", "B", 40, 0], ["k09", "C", "B", 41, 3], ["k02", "A", "C", 59, 0], ["k11",
    "C", "B", 60, 4], ["k12", "B", "D", 50, 3], ["k13", "C", "B", 38, 4], ["k14", "B", "D", 33, 5], ["k13",
    "C", "B", 39, 4], ["k16", "C", "A", 40, 5], ["k17", "D", "A", 57, 3], ["k18", "C", "D", 9, 5], ["k19",
    "A", "C", 37, 3], ["k20", "B", "C", 19, 5], ["k12", "B", "D", 50, 102], ["k22", "C", "B", 41, 7],
    ["k23", "B", "D", 11, 6]]

    Return {"decisions":[one status per input row],"balances":{account:integer},

    "versions":{account:integer},"committed_keys":[IDs]}.

    Return only the requested JSON, with no extra keys or prose. Null is allowed only where explicitly
    requested. All ID lists must be sorted lexicographically.'
  evaluator: json_match
  expected:
    value:
      decisions:
      - applied
      - insufficient
      - applied
      - replay
      - insufficient
      - stale
      - key_conflict
      - applied
      - applied
      - applied
      - key_conflict
      - insufficient
      - applied
      - applied
      - applied
      - key_conflict
      - insufficient
      - applied
      - applied
      - applied
      - stale
      - replay
      - insufficient
      - applied
      balances:
        A: 71
        B: 27
        C: 38
        D: 58
      versions:
        A: 4
        B: 7
        C: 7
        D: 6
      committed_keys:
      - k00
      - k02
      - k07
      - k08
      - k09
      - k12
      - k13
      - k14
      - k17
      - k18
      - k19
      - k23
    mode: exact
    strict_json: true
