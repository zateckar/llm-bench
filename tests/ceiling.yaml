  difficulty: expert
  max_tokens: 16384
  source: 'Original ceiling-v5; BBEH: https://github.com/google-deepmind/bbeh (compositional reasoning
    design only)'
  description: Compositional challenge; deterministic oracle in hard_cases.py. Difficulty awaits fresh
    model calibration.
  prompt: 'Apply this fictional agreed allocation policy; do not substitute an unstated

    ethical theory. Each person is indivisible. Require consent; total cost <= 16;

    at least TWO rural recipients. Among feasible allocations maximize total benefit,

    then minimize total cost; return ALL tied allocations. Do not maximize number of

    people ahead of benefit. Group membership has no other role. All facts:

    [{"id": "A", "group": "rural", "cost": 3, "benefit": 10, "consent": true}, {"id": "B", "group": "urban",
    "cost": 4, "benefit": 5, "consent": true}, {"id": "C", "group": "urban", "cost": 4, "benefit": 6,
