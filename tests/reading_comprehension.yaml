# Challenge suite v2. Answer-key derivations: challenge_oracles.py.
# All parts must pass; no keyword-only credit. IDs intentionally differ from v1.

- id: RC2-01
  category: Reading Comprehension
  difficulty: hard
  source: challenge-v2
  description: Reconcile withdrawals and reinstatements without misreading an exception
  prompt: |
    A register originally lists applications a=12, b=9, c=7, d=16, e=11 units.
    A later notice withdraws b and c. The final notice reinstates c and confirms d;
    confirmation does not add a second copy. The unit figures never change.
    The summary includes all applications except those still withdrawn. Its
    "over ten" measure counts applications with strictly more than 10 units,
    not their units. Return JSON with included (IDs sorted), total (units), and
    over_ten (application count). The original register is not the final state.
  evaluator: json_match
  expected:
    value:
      included:
      - a
      - c
      - d
      - e
      total: 46
      over_ten: 3
    mode: exact
- id: RC2-02
  category: Reading Comprehension
  difficulty: expert
  source: challenge-v2
  description: 'Bitemporal reading: effective dates differ from known-at dates'
  prompt: |
    A fictional rate ledger records (effective day, recorded day, rate):
    (1,1,100),(5,8,120),(5,12,110),(10,10,150),(10,15,140).
    To answer "rate for service day D as known on day K", use only records with
    effective<=D and recorded<=K. Choose the greatest effective day, then the
    greatest recorded day. Later corrections do not change what was known earlier.
    Answer (D,K) queries in order: (6,7),(6,9),(6,13),(11,11),(11,14),(11,16).
    Return JSON {"rates": [six integers]}.
  evaluator: json_match
  expected:
    value:
      rates:
      - 100
      - 120
      - 110
      - 150
      - 150
      - 140
    mode: exact
  max_tokens: 8192
- id: RC2-03
  category: Reading Comprehension
  difficulty: hard
  source: challenge-v2
  description: Policy exceptions and strict boundary interpretation
  prompt: |
    Use only this fictional retention policy: standard records are deleted once
    older than 30 days. Premium records instead use 90 days. A hold overrides
    both and prevents deletion regardless of age. "Older than" is strict.
    Records (id,age,premium,hold): (a,40,false,false),(b,40,true,false),
    (c,95,true,false),(d,120,false,true),(e,30,false,false),(f,91,false,false).
    Return JSON {"delete": sorted IDs eligible now, "retain": all other IDs sorted}.
  evaluator: json_match
  expected:
    value:
      delete:
      - a
      - c
      - f
      retain:
      - b
      - d
      - e
    mode: exact
- id: RC2-04
  category: Reading Comprehension
  difficulty: hard
  source: challenge-v2
  description: Separate physical stock, reservations, returns, and availability
  prompt: |
    A store starts with 37 sellable units and no reservations. In chronological
    order: receive 18 sellable units; reserve 20; ship 12 of those reserved units;
    cancel reservations for 3 unshipped units; receive 7 returned units, of which
    only 4 pass inspection and enter sellable stock (the other 3 never enter it);
    remove 6 damaged units from the unreserved sellable stock; reserve 9 more units.
    Reserving/cancelling changes reservations, not physical stock. Shipping reduces
    both. Available equals physical sellable stock minus outstanding reservations.
    Return JSON with physical_sellable, reserved, available, and damaged_removed
    (only the units removed from stock, excluding returns rejected at inspection).
  evaluator: json_match
  expected:
    value:
      physical_sellable: 41
      reserved: 14
      available: 27
      damaged_removed: 6
    mode: exact
- id: RC2-05
  category: Reading Comprehension
  difficulty: expert
  source: challenge-v2
  description: Track cohort origins across simultaneous transfers and withdrawals
  prompt: |
    A training program begins with group A=240 people and B=160. Simultaneously,
    one quarter of ORIGINAL A transfers to B and one eighth of ORIGINAL B transfers
    to A. After the transfers, 15 people from the original-A members who stayed in
    A withdraw; 25 people from the original-B members who stayed in B withdraw.
    No transferees withdraw and no other changes occur.
    Return JSON with final_A, final_B, retained_original_A_in_A, and A_fraction
    (fraction of all remaining participants in A, as a reduced [numerator,denominator]).
  evaluator: json_match
  expected:
    value:
      final_A: 185
      final_B: 175
      retained_original_A_in_A: 165
      A_fraction:
      - 37
      - 72
    mode: exact
  max_tokens: 8192
- id: RC2-06
  category: Reading Comprehension
  difficulty: expert
  source: challenge-v2
  description: Union overlapping downtime before exclusions and clipping
  prompt: |
    A report covers minute interval [0,45). Incident intervals are [4,15),
    [12,23), [26,35), [39,48). Approved maintenance intervals [10,14) and [28,32)
    are excluded wherever they overlap incidents. Count the union of incident
    time within the reporting window, excluding maintenance, without double-counting
    overlaps. The downtime budget is at most 25 minutes. All intervals are half-open.
    Return JSON with counted_downtime, meets_budget (boolean), and excess_minutes
    (zero if within budget, otherwise counted downtime minus budget).
  evaluator: json_match
  expected:
    value:
      counted_downtime: 26
      meets_budget: false
      excess_minutes: 1
    mode: exact
  max_tokens: 8192
- id: RC2-07
  category: Reading Comprehension
  difficulty: expert
  source: challenge-v2
  description: Invoice ordering, threshold basis, and explicit cent rounding
  prompt: |
    An invoice buys 3 items at 1999 cents each and 2 at 1250 cents each. Apply a
    15% merchandise-only coupon, rounding the DISCOUNT to nearest cent, half up.
    Shipping is free only when merchandise AFTER the rounded discount is at least
    7500 cents; otherwise shipping is 650 cents. Tax is 8.25% of discounted merchandise
    plus shipping, rounded to nearest cent, half up. Round only the discount and tax.
    Return JSON of integer cents: subtotal, discount, shipping, tax, total.
  evaluator: json_match
  expected:
    value:
      subtotal: 8497
      discount: 1275
      shipping: 650
      tax: 649
      total: 8521
    mode: exact
  max_tokens: 8192
- id: RC2-08
  category: Reading Comprehension
  difficulty: expert
  source: challenge-v2
  description: Resolve approved revisions independently for each region
  prompt: |
    For the day-20 report, choose each region's latest APPROVED quota with effective
    day <=20; ties in effective day use the larger revision. Unapproved entries
    and future entries have no effect. Entries (region,revision,effective,quota,approved):
    (north,1,5,40,true),(south,1,5,30,true),(north,2,12,45,false),
    (south,2,18,35,true),(north,3,21,50,true),(east,1,15,20,true),
    (east,2,15,22,true),(south,3,19,99,false).
    Return JSON with quotas (region->quota), revisions (region->selected revision),
    and total (sum of selected quotas). Do not sum revisions or silently accept drafts.
  evaluator: json_match
  expected:
    value:
      quotas:
        east: 22
        north: 40
        south: 35
      revisions:
        east: 2
        north: 1
        south: 2
      total: 97
    mode: exact
  max_tokens: 8192
