  difficulty: hard
  description: "Requires the algorithm allowlist, not just the words 'alg confusion'"
  prompt: |
    A service verifies JWTs like this:

    ```python
    import jwt
    claims = jwt.decode(token, key=PUBLIC_KEY_PEM)
    ```

    The tokens are supposed to be RS256. Explain every way an attacker can abuse this call and give
    the corrected call.
  evaluator: security_analysis
  expected:
    criteria:
      - '(?:algorithm\s*confusion|alg\s*confusion|"?alg"?\s*(?:header\s*)?(?:is\s*)?(?:attacker|user)[- ]controlled)'
      - '(?:alg\s*[:=]\s*["'']?none|["'']?none["'']?\s*algorithm|unsigned token)'
      - '(?:hs256|hmac)[\s\S]{0,200}(?:public key|verification key)|public key[\s\S]{0,120}(?:hs256|hmac)[\s\S]{0,60}(?:secret|key)'
      - 'algorithms\s*=\s*\[\s*["'']RS256["'']'
      - '(?:verify_(?:exp|aud|signature)|audience\s*=|issuer\s*=|\bexp\b|\baud\b)'
    must_not:
