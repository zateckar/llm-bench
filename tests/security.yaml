# Security Test Suite
# Inspired by rapticore/llm-security-benchmark
# Tests vulnerability identification and secure coding knowledge

# =================== INJECTION ATTACKS ===================
- id: SE-01
  category: Security
  prompt: |
    Identify ALL security vulnerabilities in this code:

    ```python
    from flask import Flask, request
    import sqlite3

    app = Flask(__name__)

    @app.route('/login', methods=['POST'])
    def login():
        username = request.form['username']
        password = request.form['password']
        
        conn = sqlite3.connect('users.db')
        query = f"SELECT * FROM users WHERE username='{username}' AND password='{password}'"
        user = conn.execute(query).fetchone()
        
        if user:
            return f'Welcome {username}!'
        return 'Invalid credentials', 401

    @app.route('/search')
    def search():
        q = request.args.get('q')
        return f'<h1>Results for: {q}</h1>'
    ```
    
    List each vulnerability with its OWASP category and a fix.
  evaluator: security_analysis
  expected:
    criteria:
      - 'sql\s*injection'
      - 'xss|cross.*site.*scripting'
      - 'plaintext.*password|password.*plain'
      - 'parameterized|prepared\s*statement'
      - 'escape|sanitize|encode'
    must_not:
      - '\bno\s+(?:issues|vulnerabilities|problems)\b'
      - '\bcode is secure\b'

