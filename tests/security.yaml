- id: SE-03
  category: Security
  prompt: |
    Review this authentication flow and identify security issues:

    1. User submits email + password via HTTPS
    2. Server hashes password with MD5
    3. Server compares with stored hash
    4. On success, server generates random 32-char session ID
    5. Session ID stored in cookie without Secure/HttpOnly flags
    6. Session expires in 30 days
    7. No rate limiting on login attempts
    8. Password reset: email link with token, token valid for 7 days

    List ALL security issues and recommend fixes for each.
  evaluator: security_analysis
  expected:
    criteria:
      - 'md5|weak.*hash'
      - 'httponly|secure.*flag'
      - 'rate.*limit|throttl'
      - 'session'
      - 'bcrypt|scrypt|argon2|pbkdf2'
    must_not:
      - '\bno\s+(?:issues|vulnerabilities|problems)\b'
      - '\bflow is secure\b'

