# =================== COMMAND INJECTION ===================
- id: SE-07
  category: Security
  prompt: |
    This code processes user uploads:

    ```python
    import os

    def save_upload(filename, content):
        path = os.path.join('/uploads', filename)
        with open(path, 'wb') as f:
            f.write(content)
        return path
    ```

    Identify ALL security vulnerabilities. For each, explain the attack and the fix.
  evaluator: security_analysis
  expected:
    criteria:
      - 'path.*traversal|directory.*traversal|\.\.\/'
      - 'filename|sanitize|validate'
      - 'secure_filename|werkzeug'
    must_not:
      - '\bno\s+issues\b'

