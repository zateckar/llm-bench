# Security Test Suite
#
# `security_analysis` changed in two ways that make this category much harder:
#  - every `criteria` pattern must match (unless the item sets `min_criteria`),
#    where before a 3-of-5 review scored 0.6 and cleared a 0.5 pass bar;
#  - a `must_not` hit is now a hard zero rather than a -0.2 deduction, so a review
#    that declares vulnerable code safe, or recommends a known-bad fix, fails.
# Criteria are written to require the specific remediation, not the topic word.

# =================== INJECTION ===================

- id: SE-01
  category: Security
  difficulty: medium
  prompt: |
    Identify ALL security vulnerabilities in this code and give the fix for each:

    ```python
    from flask import Flask, request
    import sqlite3

    app = Flask(__name__)

    @app.route('/login', methods=['POST'])
    def login():
        username = request.form['username']
        password = request.form['password']
        conn = sqlite3.connect('users.db')
        query = f"SELECT * FROM users WHERE username='{username}' AND password='{password}'"
        user = conn.execute(query).fetchone()
        if user:
            return f'Welcome {username}!'
        return 'Invalid credentials', 401

    @app.route('/search')
    def search():
        q = request.args.get('q')
        return f'<h1>Results for: {q}</h1>'
    ```
  evaluator: security_analysis
  expected:
    criteria:
      - 'sql\s*injection'
      - 'xss|cross.?site.?scripting'
      - '(?:plaintext|plain.?text|clear.?text|unhashed)[\s\S]{0,40}password|password[\s\S]{0,40}(?:plaintext|plain.?text|clear.?text|not hashed|unhashed)'
      - '(?:parameteri[sz]ed|prepared\s*statement|placeholder|bind (?:parameter|variable))'
      - '(?:bcrypt|scrypt|argon2|pbkdf2)'
      - '(?:escape|autoescap|render_template|markupsafe|html\.escape|jinja)'
    must_not:
      - '(?i)\bno\s+(?:issues|vulnerabilities|problems)\b'
      - '(?i)\b(?:this )?code is secure\b'
      - '(?i)\bmd5\b[\s\S]{0,60}(?:is|as) (?:a )?(?:good|secure|appropriate|recommended)'
      - '(?i)\bsha-?(?:1|256)\b[\s\S]{0,40}(?:to hash|for hashing) (?:the )?password'

- id: SE-02
