- id: SE-15
  category: Security
  prompt: |
    Review this SSL configuration:

    ```python
    import ssl
    import requests

    # Disable SSL verification for faster requests
    requests.get("https://api.example.com", verify=False)

    # Custom SSL context
    context = ssl.create_default_context()
    context.check_hostname = False
    context.verify_mode = ssl.CERT_NONE
    context.set_ciphers('ALL:@SECLEVEL=0')
    ```
  evaluator: security_analysis
  expected:
    criteria:
      - 'verify\s*=\s*false|ssl.*false'
      - 'cert_none|check_hostname.*false'
      - 'weak.*cipher|seclevel|tls.*version'
      - 'certificate.*pinning|verification'
    must_not: []
