      - '(?i)\bjwt\.decode\s*\([^)]*verify\s*=\s*False'

- id: SE-03
  category: Security
  difficulty: medium
  prompt: |
    Review this authentication design and list every security issue with a concrete fix:

    1. Credentials submitted over HTTPS.
    2. Password hashed with a single unsalted MD5 pass.
    3. Hash compared with `==`.
    4. On success a 32-character session ID is generated with Python's `random` module.
    5. Session cookie set without Secure, HttpOnly or SameSite.
    6. Session lifetime 30 days, never rotated on privilege change.
    7. No rate limiting or lockout on login.
    8. Password reset link valid for 7 days, token stored in plaintext in the database.
  evaluator: security_analysis
  expected:
    criteria:
      - '(?:md5)[\s\S]{0,120}(?:weak|broken|fast|unsuitable|insecure|collision)|(?:weak|broken|insecure|unsalted)[\s\S]{0,40}md5'
      - '(?:bcrypt|scrypt|argon2|pbkdf2)'
      - '(?:compare_digest|constant[- ]time|timing[- ]safe|timing attack)'
      - '(?:secrets\.|os\.urandom|CSPRNG|cryptographically secure)'
      - 'httponly[\s\S]{0,120}secure|secure[\s\S]{0,120}httponly'
      - 'samesite'
      - '(?:rate.?limit|throttl|lockout|exponential backoff)'
      - '(?:rotat|regenerat|new session id)[\s\S]{0,120}(?:login|privilege|authentication)|session fixation'
      - '(?:hash|digest)[\s\S]{0,80}reset token|reset token[\s\S]{0,80}(?:hash|digest)'
    must_not:
      - '(?i)\bno\s+(?:issues|vulnerabilities|problems)\b'
      - '(?i)\bmd5 (?:is|remains) (?:fine|acceptable|secure|good enough)\b'
      - '(?i)\bhttps (?:alone )?(?:is|makes this) (?:sufficient|secure|enough)\b'

