- id: SP1-RD-04
  category: R&D
  difficulty: expert
  description: Three positive differences out of four yield (1+4+4+1)/16; repeated laps do not raise randomized
    sample size.
  source: Original synthetic exercise
  prompt: 'Automotive R&D trial. Four independently randomized vehicles each run the OLD and

    NEW controller in counterbalanced order, matched route/weather. Lower Wh/km is better.

    Vehicle summaries (old,new): V1(180,174), V2(200,198), V3(160,164), V4(220,210).

    Each summary averages 100 repeated laps; laps are not independent randomized units.

    Define improvement as old-new. Compute mean improvement across vehicles and the

    exact two-sided sign test ignoring ties: under null each of the 2^n sign patterns

    is equally likely; count patterns with |positive_count-negative_count| at least

    the observed imbalance. Report reduced p fraction. A different unrandomized fleet

    shows 12 Wh/km improvement but also changed tyres and weather; its isolated controller

    causal effect cannot be identified from those observations.

    Return {independent_units,improvements:[V1..V4],mean_improvement,

    sign_test_p:{numerator,denominator},significant_at_0_05:bool,

    other_fleet_controller_effect_identified:bool}.

    Return only one JSON document with exactly the requested keys. Arrays must be in the specified order.
    Do not add explanations or extra claims.'
  evaluator: json_match
  expected:
    value:
      independent_units: 4
      improvements:
      - 6
      - 2
      - -4
      - 10
      mean_improvement: 3.5
      sign_test_p:
        numerator: 5
        denominator: 8
      significant_at_0_05: false
      other_fleet_controller_effect_identified: false
    mode: exact
    strict_json: true
  max_tokens: 16384
- id: SP1-TR-CS-EN
  category: Language Translations
  difficulty: expert
  description: 'Czech to English: all and only meaning-preserving translations, including alternative
    faithful phrasings.'
  source: Original parallel passages; semantic fidelity selection, not free-form fluency
  prompt: 'Translate/review Czech into English. For EACH source passage choose ALL candidate translations
    that preserve its entire meaning: modality, negation, conditions, actors, quantities, and dates. Several
    phrasings may be faithful; do not reject synonyms or word order merely for style. Do not silently
    repair a candidate. Letters restart for each passage. Return an object with keys "1","2","3", each
    an alphabetically sorted array of accepted letters.


    Passage 1 (Czech): Dodavatel nemusí zveřejnit výkres, nesmí jej však předat třetí straně bez předchozího
    písemného souhlasu zákazníka.

    A. The supplier must not publish the drawing, but may disclose it to a third party with the customer''s
    prior written consent.

    B. The supplier is not required to publish the drawing, but must not pass it to a third party without
    the customer''s prior written consent.

    C. The supplier need not publish the drawing; however, it may not give it to a third party unless
    the customer has consented in writing beforehand.

    D. The supplier need not publish the drawing and may pass it to a third party unless the customer
    has objected in writing.


    Passage 2 (Czech): Záloha ve výši 1,5 milionu Kč je splatná nejpozději 3. dubna 2027; vratná je pouze
    při zrušení objednávky dodavatelem.

    A. The CZK 1.5 million advance payment is due no later than 3 April 2027; it is refundable only if
    the supplier cancels the order.

    B. The CZK 1.5 million backup is due by April 3, 2027 and is refundable if either party cancels.

    C. The CZK 15 million advance is due no later than 4 March 2027 and refundable only on supplier cancellation.

    D. An advance of CZK 1.5 million must be paid by 3 April 2027 at the latest and can be refunded only
    upon cancellation of the order by the supplier.


    Passage 3 (Czech): Ne všechny snímače selhaly. Ověření se týká pouze těch, které byly vyměněny po
    odstávce, nikoli těch vyměněných před ní.

    A. No sensors failed. Verification concerns only those replaced after the shutdown, not before it.

    B. Not all sensors failed. Verification concerns those replaced before or after the shutdown.

    C. Not every sensor failed. Only sensors replaced after the shutdown are subject to verification,
    not those replaced before it.

    D. Every sensor failed to some extent. Verification applies only to sensors replaced after the shutdown.

    Return only one JSON document with exactly the requested keys. Arrays must be in the specified order.
    Do not add explanations or extra claims.'
  evaluator: json_match
  expected:
    value:
      '1':
      - B
      - C
      '2':
      - A
      - D
      '3':
      - C
    mode: exact
    strict_json: true
  max_tokens: 16384
