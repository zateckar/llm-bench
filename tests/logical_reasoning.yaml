# Challenge suite v2. Answer-key derivations: challenge_oracles.py.
# All parts must pass; no keyword-only credit. IDs intentionally differ from v1.

- id: LR2-01
  category: Logical Reasoning
  difficulty: expert
  source: challenge-v2
  description: Count all linear arrangements under interacting constraints
  prompt: |
    Arrange A,B,C,D,E,F,G in seven positions, using each letter exactly once.
    A is before D, D is before G, B is before E, and E is before G.
    Exactly one letter lies between C and F. B is not first. A and B are not adjacent.
    Return a JSON object with count (the number of valid arrangements), first
    (lexicographically smallest arrangement), and last (lexicographically largest).
    Represent each arrangement as a seven-letter string. Use alphabetic order A < B < ... < G.
  evaluator: json_match
  expected:
    value:
      count: 24
      first: ACBFDEG
      last: FBCEADG
    mode: exact
  max_tokens: 8192
- id: LR2-02
  category: Logical Reasoning
  difficulty: expert
  source: challenge-v2
  description: Enumerate fixed points of mutually referring truth claims
  prompt: |
    Six speakers A through F are each either truthful (every claim true) or lying
    (every claim false). They make exactly these claims about their types:
    A: "Exactly one of B and C is truthful."
    B: "A is truthful and D is lying."
    C: "Exactly two of A, B, D are truthful."
    D: "C and E have the same type."
    E: "F is lying or B is truthful" (inclusive or).
    F: "D and A have different types."
    Find ALL consistent type assignments. Return JSON {"models": [...], "count": ...}.
    Each model is a six-character T/F string in A,B,C,D,E,F order. Sort the strings
    lexicographically with F before T. Do not assume the solution is unique.
  evaluator: json_match
  expected:
    value:
      models:
      - FFFFTF
      - FFFTFT
      - TFTTTF
      count: 3
    mode: exact
  max_tokens: 8192
- id: LR2-03
  category: Logical Reasoning
  difficulty: expert
  source: challenge-v2
  description: Precedence scheduling with resource contention
  prompt: |
    Seven non-preemptive jobs have durations A=3,B=5,C=2,D=4,E=3,F=5,G=2.
    Dependencies (predecessor -> successor) are A->D, B->D, B->E, C->F, D->G, E->G.
    Two identical workers are available at time 0. Each runs at most one job at a
    time; a job uses one worker. Jobs can start immediately when all predecessors
    finish. Waiting is allowed, transfer costs are zero, and all jobs must finish.
    Return JSON {"two_workers": minimum completion time, "total_work": sum of durations}.
  evaluator: json_match
  expected:
    value:
      two_workers: 13
      total_work: 24
    mode: exact
  max_tokens: 8192
- id: LR2-04
  category: Logical Reasoning
  difficulty: expert
  source: challenge-v2
  description: Shortest state path with exact final-state requirement
  prompt: |
    Two jugs have capacities 9 and 4 litres. Both start empty. Allowed unit-cost
    operations: fill either jug, empty either jug, or pour either into the other
    until the source is empty or the destination is full. Unlimited water exists.
    The FINAL state must be (6,0): six litres in the 9-litre jug, the other empty.
    Return JSON {"operations": minimum number, "shortest_state_paths": number of
    distinct shortest sequences of states including the initial and final states}.
    Ignore operations that leave the state unchanged. Different operations reaching
    the same next state count as the same state-path step.
  evaluator: json_match
  expected:
    value:
      operations: 9
      shortest_state_paths: 1
    mode: exact
  max_tokens: 8192
- id: LR2-05
  category: Logical Reasoning
  difficulty: expert
  source: challenge-v2
  description: Misere game with history-dependent legal moves
  prompt: |
    Players alternate removing 1, 3, or 4 stones from one pile. A move cannot use
    the same number as the immediately previous move (by either player). Taking
    the last stone loses immediately. A player with no legal move also loses.
    Initially there is no previous move. Both players play optimally.
    Return JSON with winning_first_moves (all winning moves from 23 stones, sorted)
    and losing_sizes (all initial pile sizes from 1 through 24 where the first
    player loses, sorted). A move removing more stones than remain is illegal.
  evaluator: json_match
  expected:
    value:
      winning_first_moves:
      - 1
      losing_sizes:
      - 1
      - 6
      - 11
      - 16
      - 21
    mode: exact
  max_tokens: 8192
- id: LR2-06
  category: Logical Reasoning
  difficulty: expert
  source: challenge-v2
  description: Satisfiability versus entailment across all models
  prompt: |
    Boolean variables A,B,C,D,E,F satisfy every constraint below:
    A implies B; B implies C; not both C and D; D or E (inclusive);
    E is true if and only if exactly one of A and F is true;
    exactly three of the six variables are true.
    Return JSON with count (satisfying assignments), always_true (variables true
    in every satisfying assignment), and always_false (variables false in every
    satisfying assignment). Sort both arrays alphabetically.
  evaluator: json_match
  expected:
    value:
      count: 2
      always_true:
      - E
      - F
      always_false:
      - A
      - B
    mode: exact
  max_tokens: 8192
- id: LR2-07
  category: Logical Reasoning
  difficulty: expert
  source: challenge-v2
  description: Successive public-announcement elimination
  prompt: |
    The possible dates are Apr-11, Apr-14, Apr-17, Jun-12, Jun-16, Sep-11,
    Sep-13, Dec-13, Dec-14, Dec-12. M knows only the month and D only the day.
    Both are perfect logicians; the list and these rules are common knowledge.
    M: "I do not know the date, and I know D does not know it."
    D: "Before that statement I did not know, but now I know."
    M: "Now I know too."
    Each statement is truthful and incorporates all earlier public statements.
    Return JSON {"remaining_counts": [number of dates after statement 1, after
    statement 2, after statement 3], "dates": [all final dates in lexical order]}.
    Use date strings exactly as given.
  evaluator: json_match
  expected:
    value:
      remaining_counts:
      - 5
      - 3
      - 1
      dates:
      - Sep-11
    mode: exact
  max_tokens: 8192
- id: LR2-08
  category: Logical Reasoning
  difficulty: expert
  source: challenge-v2
  description: Minimum fault diagnosis with positive and negative evidence
  prompt: |
    A diagnostic path alarms if and only if at least one component on it is faulty.
    Components have fixed states across tests, with no masking or test errors.
    Paths ABC, BDE, CEF, ADG, EFG alarm; the single-component path D is quiet.
    Identify the minimum possible number of faulty components and EVERY faulty set
    of that size consistent with the evidence. Return JSON {"faults": integer,
    "explanations": [...]}. Encode a set as alphabetically sorted letters without
    spaces, and sort the explanations lexicographically.
  evaluator: json_match
  expected:
    value:
      faults: 2
      explanations:
      - AE
    mode: exact
  max_tokens: 8192
- id: LR2-09
  category: Logical Reasoning
  difficulty: expert
  source: challenge-v2
  description: Resource-constrained route optimization
  prompt: |
    Directed edges are (from,to,cost,fuel):
    (S,A,4,2),(S,B,2,4),(A,B,1,1),(A,C,5,1),(B,C,2,3),
    (B,D,6,1),(C,D,1,1),(C,T,5,2),(D,T,2,3).
    Travel S to T with total fuel at most 9; no refueling. Minimize total cost,
    then total fuel, then the lexicographic path string. Also count ALL feasible
    S-to-T paths under the fuel cap, not just optimal ones.
    Return JSON {"cost": ..., "fuel": ..., "path": "S...T", "feasible_paths": ...}.
  evaluator: json_match
  expected:
    value:
      cost: 9
      fuel: 9
      path: SBCT
      feasible_paths: 6
    mode: exact
  max_tokens: 8192
- id: LR2-10
  category: Logical Reasoning
  difficulty: expert
  source: challenge-v2
  description: Derive serialization constraints from a transaction trace
  prompt: |
    Read the operation trace in order:
    r1(x), r2(y), r3(z), w1(y), r4(x), w2(z), w3(x), w4(w).
    ri(k)/wi(k) mean transaction i reads/writes item k; w is also the name of an item.
    For different transactions, two operations conflict exactly when they access
    the same item and at least one is a write. A conflict adds an edge from the
    earlier operation's transaction to the later one's. Deduplicate edges.
    Return JSON {"edges": [...], "serial_orders": [...]} with each edge encoded
    as two digits (e.g. "12"), and every topological ordering encoded as four digits.
    Sort both arrays lexicographically. If the graph is cyclic, serial_orders is [].
  evaluator: json_match
  expected:
    value:
      edges:
      - '13'
      - '21'
      - '32'
      - '43'
      serial_orders: []
    mode: exact
  max_tokens: 8192
- id: LR2-11
  category: Logical Reasoning
  difficulty: expert
  source: challenge-v2
  description: Ranked-choice transfers and deterministic tie handling
  prompt: |
    Ballot groups are 6 voters: ABCD; 5: BCDA; 4: CDAB; 3: DCBA; 2: DBAC.
    Each string ranks candidates from most to least preferred. In each round each
    ballot counts for its highest-ranked remaining candidate. Eliminate exactly
    one candidate with the fewest votes; on a tie eliminate the alphabetically
    earliest. Continue until only one remains, even if a majority occurs earlier.
    Return JSON with rounds (vote-count objects just BEFORE each elimination,
    containing only remaining candidates), eliminated (in order), and winner.
  evaluator: json_match
  expected:
    value:
      rounds:
      - A: 6
        B: 5
        C: 4
        D: 5
      - A: 6
        B: 5
        D: 9
      - A: 6
        D: 14
      eliminated:
      - C
      - B
      - A
      winner: D
    mode: exact
  max_tokens: 8192
- id: LR2-12
  category: Logical Reasoning
  difficulty: expert
  source: challenge-v2
  description: Assignment optimization with forbidden pairs and coupled constraint
  prompt: |
    Assign each worker A,B,C,D,E to a different job 1,2,3,4,5. Costs by job are:
    A: 9,2,7,8,6; B: 6,4,3,7,5; C: 5,8,1,8,3;
    D: 7,6,9,4,2; E: 8,5,2,9,7.
    A cannot take job 2; C cannot take job 3; B's job number must be smaller than E's.
    Minimize total cost. Return JSON {"cost": ..., "assignments": [...]} containing
    EVERY optimum as a five-digit string listing jobs for A,B,C,D,E. Sort the strings.
  evaluator: json_match
  expected:
    value:
      cost: 21
      assignments:
      - '42153'
      - '52143'
    mode: exact
  max_tokens: 8192
