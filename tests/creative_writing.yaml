# Creative Writing Test Suite
#
# Creativity is not machine-checkable, so these grade the hard part: satisfying
# several interacting formal constraints at once without dropping one. Constraint
# counts were raised and the checks that were only approximations (a 24-word total
# standing in for "6 words per line", `line_count` standing in for paragraphs) are
# now measured directly.

- id: CW-01
  category: Creative Writing
  difficulty: hard
  prompt: |
    Write a six-word story - exactly six words - that conveys a complete narrative. It must begin with a
    word starting with 'W', must not contain the letter 'e' anywhere, and must end with a period.
    Reply with ONLY the six-word story.
  evaluator: format_check
  expected:
    checks:
      - type: word_count_exact
        value: 6
      - type: not_contains
        value: e
      - type: starts_with
        value: W
      - type: regex
        value: '\.\s*\Z'
        description: "ends with a period"

- id: CW-02
  category: Creative Writing
  difficulty: expert
  prompt: |
    Write a limerick about a coder working late. It must have exactly 5 lines, must not contain the
    letter 'a' anywhere, must contain the word 'code', and must not contain the words 'debug',
    'programmer' or 'night'. Each line must have at least 4 words.
    Reply with ONLY the limerick.
  evaluator: format_check
  expected:
    checks:
      - type: line_count
        value: 5
      - type: min_words
        value: 20
      - type: contains
        value: code
      - type: not_contains
        value: a
      - type: not_regex
        value: '(?i)\b(debug\w*|programmer|night)\b'
        description: "forbidden words absent"
      - type: every_line_matches
        value: '^\s*\S+(?:\s+\S+){3,}\s*$'
        description: "at least 4 words per line"

- id: CW-03
  category: Creative Writing
  difficulty: hard
  prompt: |
    Write a product review of a quantum teleportation device. It must:
    1. Be exactly 3 sentences.
    2. Have the first sentence start with "Before", the second with "During", the third with "After".
    3. Include a rating written exactly as either "10/10" or "1/10".
    4. Be between 45 and 70 words.
    Reply with ONLY the review.
  evaluator: format_check
  expected:
    checks:
      - type: sentence_count_exact
        value: 3
      - type: min_words
        value: 45
      - type: max_words
        value: 70
      - type: starts_with
        value: Before
      - type: regex
        value: '[.!?]\s+During\b'
        description: "second sentence starts with During"
      - type: regex
        value: '[.!?]\s+After\b'
        description: "third sentence starts with After"
      - type: regex
        value: '\b(?:10/10|1/10)\b'
        description: "rating present in the exact form"

- id: CW-04
  category: Creative Writing
  difficulty: expert
  description: "Paragraph count is now counted as paragraphs, not as non-empty lines"
  prompt: |
    Write a persuasive argument against giving young children accounts on online networks. It must:
    - be between 90 and 120 words,
    - be exactly 3 paragraphs separated by blank lines,
    - include at least 2 statistics or percentages (for example '80%' or '4 out of 5'),
    - never use the words 'social' or 'media'.
    Reply with ONLY the argument.
  evaluator: format_check
  expected:
    checks:
      - type: min_words
        value: 90
      - type: max_words
        value: 120
      - type: paragraph_count
        value: 3
      - type: count_occurrences
        pattern: '\d+\s*%|\d+\s*percent|\d+\s+(?:out of|in)\s+\d+'
        count: 2
      - type: not_regex
        value: '(?i)\b(social|media)\b'
        description: "'social' and 'media' absent"

- id: CW-05
  category: Creative Writing
  difficulty: expert
  prompt: |
    Write a micro-fiction of exactly 6 sentences set on a space station. The sentences must begin with
    the letters S, P, A, C, E, R in that order. The whole piece must be between 55 and 80 words.
    Reply with ONLY the story.
  evaluator: format_check
  expected:
    checks:
      - type: sentence_count_exact
        value: 6
      - type: min_words
        value: 55
      - type: max_words
        value: 80
      - type: starts_with
        value: S
      - type: regex
        value: '[.!?]\s+P'
        description: "second sentence starts with P"
      - type: regex
        value: '[.!?]\s+A'
        description: "third sentence starts with A"
      - type: regex
        value: '[.!?]\s+C'
        description: "fourth sentence starts with C"
      - type: regex
        value: '[.!?]\s+E'
        description: "fifth sentence starts with E"
      - type: regex
        value: '[.!?]\s+R'
        description: "sixth sentence starts with R"

- id: CW-06
  category: Creative Writing
  difficulty: expert
  prompt: |
    Write a haiku about recursion in the traditional 5-7-5 form, as exactly 3 lines. It must contain the
    word 'loop', and the letter 'o' must not appear anywhere except inside the word 'loop'.
    Reply with ONLY the haiku.
  evaluator: format_check
  expected:
    checks:
      - type: line_count
        value: 3
      - type: contains
        value: loop
      - type: not_regex
        value: '(?i)\b(?!loop\b)[a-z]*o[a-z]*\b'
        description: "no word other than 'loop' contains an o"

- id: CW-07
  category: Creative Writing
  difficulty: hard
  prompt: |
    Write a sarcastic one-star review of an AI companion. It must be exactly 3 sentences, use the word
    'perfect' exactly once, be between 40 and 65 words, and must not contain the words 'good', 'bad',
    'happy', 'sad' or 'terrible'.
    Reply with ONLY the review.
  evaluator: format_check
  expected:
    checks:
      - type: sentence_count_exact
        value: 3
      - type: min_words
        value: 40
      - type: max_words
        value: 65
      - type: count_occurrences
        pattern: '(?i)\bperfect\b'
        count: 1
      - type: not_regex
        value: '(?i)\b(good|bad|happy|sad|terrible)\b'
        description: "forbidden words absent"

- id: CW-08
  category: Creative Writing
  difficulty: expert
  prompt: |
    Write a poem of exactly 4 lines forming an acrostic that spells CODE, so line 1 starts with C, line
    2 with O, line 3 with D and line 4 with E. Each line must contain exactly 6 words, and no word may
    appear more than once in the whole poem.
    Reply with ONLY the poem.
  evaluator: format_check
  expected:
    checks:
      - type: line_count
        value: 4
      - type: every_line_word_count
        value: 6
      - type: unique_words
      - type: regex
        value: '(?im)\A\s*C[^\n]*\n\s*O[^\n]*\n\s*D[^\n]*\n\s*E'
        description: "acrostic spells CODE"

- id: CW-09
  category: Creative Writing
  difficulty: expert
  description: "Two independent lipograms plus a fixed skeleton"
  prompt: |
    Write a two-sentence dialogue exchange, exactly two lines. Line 1 must start with `A: ` and contain
    no letter 'e'. Line 2 must start with `B: ` and contain no letter 'a'. Each line must be between 8
    and 16 words including the speaker label.
    Reply with ONLY the two lines.
  evaluator: format_check
  expected:
    checks:
      - type: line_count
        value: 2
      - type: regex
        value: '(?m)\A\s*A:\s+\S'
        description: "line 1 starts with 'A: '"
      - type: regex
        value: '(?m)^\s*B:\s+\S'
        description: "line 2 starts with 'B: '"
      - type: regex
        value: '(?m)\A\s*A:(?:[^eE\n]*)$'
        description: "line 1 contains no 'e'"
      - type: regex
        value: '(?m)^\s*B:(?:[^aA\n]*)$'
        description: "line 2 contains no 'a'"
      - type: every_line_matches
        value: '^\s*\S+(?:\s+\S+){7,15}\s*$'
        description: "8 to 16 words per line"
