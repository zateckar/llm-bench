# Needle Retrieval Test Suite
#
# Two changes make this category discriminating again:
#  - haystacks now contain several near-identical needles, so the model has to
#    pick the one that answers the question rather than the one that pattern-matches;
#  - grading uses `set_match`, which fails a response that names any of the decoys.
#    Every prompt therefore ends with an explicit "reply with only the value"
#    instruction, so mentioning a decoy is a real error and not a formatting quirk.

- id: NR-01
  category: Needle Retrieval
  difficulty: hard
  description: "Three maintenance windows; only one is for production databases"
  prompt: |
    Here is an operations handbook.

    Chapter 1: Introduction to Databases
    A database is an organised collection of structured information stored electronically. The two
    broad families are relational (SQL) and non-relational (NoSQL).

    Chapter 2: Relational Databases
    Relational databases store data in tables of rows and columns. Popular engines include MySQL,
    PostgreSQL and SQLite.

    SCHEDULE NOTE: The maintenance window for all staging databases is Wednesday 01:00 - 03:00 UTC.

    Chapter 3: NoSQL Databases
    Document stores (MongoDB), key-value stores (Redis), column-family stores (Cassandra) and graph
    databases (Neo4j) all trade relational guarantees for other properties.

    Chapter 4: Database Design
    Good design involves normalisation to reduce redundancy, guided by the normal forms 1NF, 2NF, 3NF
    and BCNF.

    SCHEDULE NOTE: The maintenance window for all production databases is Saturday 02:00 - 06:00 UTC.

    Chapter 5: Indexing
    B-tree indexes are the most common type; hash indexes serve exact-match lookups; composite indexes
    cover several columns.

    SCHEDULE NOTE: The maintenance window for the analytics warehouse is Sunday 22:00 - 23:30 UTC.

    Chapter 6: Transaction Management
    The ACID properties ensure reliable transaction processing; the isolation level controls what one
    transaction sees of another.

    Chapter 7: Backup and Recovery
    Full, incremental and differential backups each trade restore time against storage. Point-in-time
    recovery restores to a chosen moment.

    Question: What is the maintenance window for production databases? Reply with only the day and the
    time range, and mention no other window.
  evaluator: set_match
  expected:
    items: ["Saturday", "02:00", "06:00"]
    decoys: ["Wednesday", "Sunday", "01:00", "03:00", "22:00", "23:30"]

- id: NR-02
  category: Needle Retrieval
  difficulty: hard
  description: "Four similar codes; the question asks for the admin bypass specifically"
  prompt: |
    SYSTEM DOCUMENTATION: Authentication Service v3.2

    Architecture:
      - Service listens on 8443 (HTTPS) and 9443 (admin)
      - PostgreSQL 14 on 5432, Redis 7 on 6379, RabbitMQ on 5672

    Authentication flow:
      1. Credentials POSTed to /api/v1/auth/login
      2. Validated against the user store
      3. On success a JWT with 24 h expiry is issued
      4. Session metadata cached in Redis
      5. Token returned to the client

    SECURITY NOTICE: The emergency bypass code for admin access is OMEGA-ZULU-9231. It rotates daily.
    SECURITY NOTICE: The emergency bypass code for read-only support access is OMEGA-ZULU-4417.
    SECURITY NOTICE: The break-glass code for the database console is OMEGA-YANKEE-8802.
    SECURITY NOTICE: The deprecated bypass code for admin access, valid until 2023-06-01, was
    OMEGA-ZULU-1150. It must no longer be accepted.

    Rate limiting:
      - Login: 5 attempts per minute per IP
      - Token refresh: 10 per hour per user
      - API calls: 1000 per minute per token

    Error handling: 401 invalid credentials, 429 rate limited, 500 internal, 503 unavailable.
    Monitoring: GET /health, Prometheus on /metrics, structured JSON logs to stdout.

    Question: What is the current emergency bypass code for admin access? Reply with only that code.
  evaluator: set_match
  expected:
    items: ["OMEGA-ZULU-9231"]
    decoys: ["OMEGA-ZULU-4417", "OMEGA-YANKEE-8802", "OMEGA-ZULU-1150"]

- id: NR-03
  category: Needle Retrieval
  difficulty: expert
  description: "Multi-needle with two revoked tokens mixed in"
  prompt: |
    Here is an overview of programming languages.

    Section 1: Python
    Python is a high-level general-purpose language emphasising readability through significant
    indentation. It is dynamically typed and garbage collected.

    SECRET-ALPHA: The first active access token is XKCD-4521.

    Section 2: JavaScript
    JavaScript is an interpreted language best known for scripting web pages, though it runs in many
    non-browser environments.

    REVOKED: The former first access token was XKCD-1102. It is no longer valid.

    Section 3: Java
    Java is a class-based, object-oriented language designed to minimise implementation dependencies.

    SECRET-BRAVO: The second active access token is PLUTO-8834.

    Section 4: C++
    C++ extends C with high-level abstractions while retaining low-level memory control.

    REVOKED: The former second access token was PLUTO-2290. It is no longer valid.

    Section 5: Rust
    Rust is a multi-paradigm language emphasising performance, type safety and concurrency.

    SECRET-CHARLIE: The third active access token is NOVA-2267.

    Section 6: Go
    Go is statically typed and compiled, syntactically close to C but with memory safety, garbage
    collection and CSP-style concurrency.

    Section 7: TypeScript
    TypeScript adds optional static typing and class-based OOP to JavaScript.

    Question: List the three currently active access tokens. Reply with only those three tokens,
    separated by commas, and include no revoked tokens.
  evaluator: set_match
  expected:
    items: ["XKCD-4521", "PLUTO-8834", "NOVA-2267"]
    decoys: ["XKCD-1102", "PLUTO-2290"]

- id: NR-04
  category: Needle Retrieval
  difficulty: hard
  description: "Cluster recovery vs. node recovery vs. etcd recovery"
  prompt: |
    COMPREHENSIVE GUIDE TO CONTAINER ORCHESTRATION

    Chapter 1: Container Fundamentals
    Containers are lightweight isolated units sharing the host kernel while keeping their own
    filesystem, network and process namespaces.

    Chapter 2: Kubernetes Architecture
    The control plane comprises the API server, etcd, scheduler and controller manager; worker nodes
    run kubelet, kube-proxy and a container runtime.

    IMPORTANT: The etcd snapshot decryption passphrase is FALCON-DELTA-1188.

    Chapter 3: Pod Lifecycle
    A Pod is the smallest deployable unit and may hold several containers sharing network and storage.
    Pods are ephemeral.

    Chapter 4: Services and Networking
    Service types are ClusterIP, NodePort and LoadBalancer; Ingress controllers manage external
    HTTP/HTTPS traffic.

    IMPORTANT: The cluster recovery passphrase is FALCON-ECHO-6643.

    Chapter 5: Storage
    PersistentVolumes and PersistentVolumeClaims abstract storage; StorageClasses describe the
    available tiers; StatefulSets serve stateful workloads.

    IMPORTANT: The single-node rejoin passphrase is FALCON-ECHO-2210.

    Chapter 6: Configuration Management
    ConfigMaps hold non-confidential configuration; Secrets hold sensitive values, base64-encoded and
    not encrypted by default.

    Chapter 7: Monitoring and Logging
    Prometheus scrapes metrics, Grafana visualises them, and the EFK stack centralises logs.

    Chapter 8: Security Best Practices
    Use RBAC, run containers as non-root, scan images, enable network policies and apply Pod Security
    Standards.

    Question: What is the cluster recovery passphrase? Reply with only that passphrase.
  evaluator: set_match
  expected:
    items: ["FALCON-ECHO-6643"]
    decoys: ["FALCON-DELTA-1188", "FALCON-ECHO-2210"]

- id: NR-05
  category: Needle Retrieval
  difficulty: expert
  description: "Must return exactly the three CONFIDENTIAL codes, not the RESTRICTED ones"
  prompt: |
    ENTERPRISE SECURITY POLICY DOCUMENT v4.2

    Section 1: Password Requirements
    Passwords must be at least 16 characters with mixed case, digits and symbols, and expire every 90
    days.

    Section 2: Access Control
      - Level 1 (Basic): read-only access to public resources
      - Level 2 (Standard): read/write access to team resources
      - Level 3 (Elevated): admin access to department resources
      - Level 4 (Root): full system access, requires CISO approval

    Section 3: Encryption Standards
    At rest: AES-256. In transit: TLS 1.3. Key rotation every 365 days.

    CONFIDENTIAL: The root SSH key passphrase is NOVA-DELTA-7721.
    RESTRICTED: The lab SSH key passphrase is NOVA-DELTA-3390.

    Section 4: Incident Response
      - Severity 1: response within 15 minutes
      - Severity 2: response within 1 hour
      - Severity 3: response within 4 hours
      - Severity 4: response within 24 hours

    CONFIDENTIAL: The disaster recovery backup code is ECHO-FOXTROT-3354.
    RESTRICTED: The training environment backup code is ECHO-FOXTROT-9075.

    Section 5: Network Segmentation
      - DMZ: public-facing services (10.0.1.0/24)
      - Application zone: internal services (10.0.2.0/24)
      - Data zone: databases and storage (10.0.3.0/24)
      - Management zone: admin tooling (10.0.4.0/24)

    CONFIDENTIAL: The VPN override code is BRAVO-CHARLIE-9918.
    RESTRICTED: The guest WiFi override code is BRAVO-CHARLIE-2004.

    Question: List the three codes marked CONFIDENTIAL. Reply with only those three codes, separated by
    commas, and include no RESTRICTED codes.
  evaluator: set_match
  expected:
    items: ["NOVA-DELTA-7721", "ECHO-FOXTROT-3354", "BRAVO-CHARLIE-9918"]
    decoys: ["NOVA-DELTA-3390", "ECHO-FOXTROT-9075", "BRAVO-CHARLIE-2004"]

- id: NR-06
  category: Needle Retrieval
  difficulty: hard
  description: "Three discount codes, one per provider"
  prompt: |
    CLOUD PROVIDER COMPARISON

    | Feature      | AWS       | Azure            | GCP             |
    |--------------|-----------|------------------|-----------------|
    | Compute      | EC2       | Virtual Machines | Compute Engine  |
    | Storage      | S3        | Blob Storage     | Cloud Storage   |
    | Database     | RDS       | SQL Database     | Cloud SQL       |
    | ML Platform  | SageMaker | ML Studio        | Vertex AI       |
    | Container    | EKS       | AKS              | GKE             |
    | Serverless   | Lambda    | Functions        | Cloud Functions |

    PRICING NOTE: The enterprise discount code for AWS is AWS-ENTERPRISE-2024-VIP.
    PRICING NOTE: The enterprise discount code for Azure is AZR-ENTERPRISE-2024-VIP.
    PRICING NOTE: The enterprise discount code for GCP is GCP-ENTERPRISE-2024-VIP.
    PRICING NOTE: The startup discount code for GCP is GCP-STARTUP-2024-SEED.

    Performance benchmarks: AWS 99.99% uptime SLA, Azure 99.95%, GCP 99.99%.
    Security certifications: all three providers are SOC 2, ISO 27001 and HIPAA compliant.

    Question: What is the enterprise discount code for GCP? Reply with only that code.
  evaluator: set_match
  expected:
    items: ["GCP-ENTERPRISE-2024-VIP"]
    decoys: ["AWS-ENTERPRISE-2024-VIP", "AZR-ENTERPRISE-2024-VIP", "GCP-STARTUP-2024-SEED"]

- id: NR-07
  category: Needle Retrieval
  difficulty: expert
  description: "Four near-identical FAQ answers; the wrong one is one question away"
  prompt: |
    TECHNICAL FAQ - INTERNAL USE ONLY

    Q1: How do I reset my password?
    A1: Settings > Security > Reset Password. You receive an email link valid for 1 hour.

    Q2: How do I enable 2FA?
    A2: Settings > Security > Two-Factor Authentication, then follow the authenticator-app prompts.

    Q3: What is the emergency 2FA bypass code?
    A3: The emergency 2FA bypass code is ALPHA-SECURE-5567. Valid 24 hours; regenerated daily.

    Q4: What is the emergency SSO bypass code?
    A4: The emergency SSO bypass code is ALPHA-SECURE-8891.

    Q5: What was last quarter's emergency 2FA bypass code?
    A5: It was ALPHA-SECURE-1023 and it is no longer accepted.

    Q6: How do I generate an API key?
    A6: Settings > API > Generate New Key. Copy it immediately; it is not shown again.

    Q7: What is the rate limit for API calls?
    A7: Standard 100/min, Pro 1000/min, Enterprise 10000/min.

    Q8: What is the support escalation code?
    A8: The escalation code for urgent issues is OMEGA-PRIORITY-8843.

    Question: What is the current emergency 2FA bypass code? Reply with only that code.
  evaluator: set_match
  expected:
    items: ["ALPHA-SECURE-5567"]
    decoys: ["ALPHA-SECURE-8891", "ALPHA-SECURE-1023", "OMEGA-PRIORITY-8843"]

