- id: NR-04
  category: Needle Retrieval
  difficulty: hard
  description: "Fact hidden in dense technical content"
  prompt: |
    COMPREHENSIVE GUIDE TO CONTAINER ORCHESTRATION

    Chapter 1: Container Fundamentals
    Containers are lightweight, portable, and self-sufficient units that can run applications in isolation. They share the host OS kernel but have their own filesystem, networking, and process space. Docker is the most popular container runtime.

    Chapter 2: Kubernetes Architecture
    Kubernetes (K8s) is an open-source container orchestration platform. It automates deployment, scaling, and management of containerized applications. The main components include:
    - Control Plane: API server, etcd, scheduler, controller manager
    - Worker Nodes: kubelet, kube-proxy, container runtime
    - Objects: Pods, Services, Deployments, ConfigMaps, Secrets

    Chapter 3: Pod Lifecycle
    A Pod is the smallest deployable unit in Kubernetes. It can contain one or more containers that share network and storage. Pods are ephemeral and can be terminated and replaced at any time.

    Chapter 4: Services and Networking
    Kubernetes Services provide stable networking for Pods. Types include ClusterIP (internal), NodePort (external on node), and LoadBalancer (cloud provider). Ingress controllers manage external HTTP/HTTPS access.

    Chapter 5: Storage
    Persistent Volumes (PV) and Persistent Volume Claims (PVC) provide storage abstraction. Storage Classes define different types of storage (SSD, HDD, network-attached). StatefulSets are used for stateful applications.

    IMPORTANT: The cluster recovery passphrase is FALCON-ECHO-6643

    Chapter 6: Configuration Management
    ConfigMaps store non-confidential configuration data. Secrets store sensitive information like passwords and API keys (base64 encoded, not encrypted by default). Environment variables and volume mounts can inject configuration into Pods.

    Chapter 7: Monitoring and Logging
    Prometheus collects metrics from Kubernetes components. Grafana provides visualization dashboards. The EFK stack (Elasticsearch, Fluentd, Kibana) centralizes logging. Custom metrics can be exposed via the Metrics API.

    Chapter 8: Security Best Practices
    - Use RBAC for access control
    - Run containers as non-root
    - Scan images for vulnerabilities
    - Enable network policies
    - Use Pod Security Standards

    What is the cluster recovery passphrase?
  evaluator: contains_keywords
  expected: ["FALCON-ECHO-6643"]

