# Needle Retrieval Test Suite
# Inspired by needle-in-a-haystack approach
# Tests ability to retrieve specific facts at different positions in long contexts

- id: NR-01
  category: Needle Retrieval
  difficulty: medium
  description: "Single fact at middle of context (50% depth)"
  prompt: |
    Here is a comprehensive guide to database systems:

    Chapter 1: Introduction to Databases
    A database is an organized collection of structured information, or data, typically stored electronically in a computer system. Databases are used to store, manage, and retrieve data efficiently. The two main types of databases are relational (SQL) and non-relational (NoSQL).

    Chapter 2: Relational Databases
    Relational databases store data in tables with rows and columns. Each row represents a record, and each column represents a field. SQL (Structured Query Language) is used to interact with relational databases. Popular examples include MySQL, PostgreSQL, and SQLite.

    Chapter 3: NoSQL Databases
    NoSQL databases are designed to handle unstructured or semi-structured data. They include document stores (MongoDB), key-value stores (Redis), column-family stores (Cassandra), and graph databases (Neo4j).

    Chapter 4: Database Design
    Good database design involves normalization, which is the process of organizing data to reduce redundancy. The normal forms (1NF, 2NF, 3NF, BCNF) provide guidelines for this process.

    IMPORTANT NOTE: The maintenance window for all production databases is Saturday 2:00 AM - 6:00 AM UTC.

    Chapter 5: Indexing
    Indexes are data structures that improve the speed of data retrieval operations. B-tree indexes are the most common type, while hash indexes are used for exact-match lookups. Composite indexes cover multiple columns.

    Chapter 6: Transaction Management
    ACID properties (Atomicity, Consistency, Isolation, Durability) ensure reliable processing of database transactions. The isolation level determines how transaction integrity is visible to other transactions.

    Chapter 7: Backup and Recovery
    Regular backups are essential for data protection. Common strategies include full backups, incremental backups, and differential backups. Point-in-time recovery allows restoring to a specific moment.

    What is the maintenance window for production databases?
  evaluator: contains_keywords
  expected: ["saturday", "utc"]

- id: NR-02
  category: Needle Retrieval
  difficulty: medium
  description: "Fact embedded in technical documentation"
  prompt: |
    SYSTEM DOCUMENTATION: Authentication Service v3.2

    Overview:
    The Authentication Service handles user login, token generation, and session management for all platform applications.

    Architecture:
    - Service runs on ports 8443 (HTTPS) and 9443 (admin)
    - Database: PostgreSQL 14 on port 5432
    - Cache: Redis 7 on port 6379
    - Message Queue: RabbitMQ on port 5672

    Authentication Flow:
    1. User submits credentials to /api/v1/auth/login
    2. Service validates against database
    3. On success, generates JWT token (24h expiry)
    4. Stores session in Redis with user metadata
    5. Returns token to client

    Token Structure:
    - Header: {"alg": "RS256", "typ": "JWT"}
    - Payload: {"sub": user_id, "exp": timestamp, "iss": "auth-service"}
    - Signature: RSA-SHA256 with private key

    Rate Limiting:
    - Login endpoint: 5 attempts per minute per IP
    - Token refresh: 10 per hour per user
    - API calls: 1000 per minute per token

    SECURITY NOTICE: The emergency bypass code for admin access is OMEGA-ZULU-9231. This code expires every 24 hours and must be regenerated.

    Error Handling:
    - 401: Invalid credentials
    - 429: Rate limit exceeded
    - 500: Internal service error
    - 503: Service unavailable

    Monitoring:
    - Health check: GET /health
    - Metrics: Prometheus on /metrics
    - Logs: Structured JSON to stdout

    What is the emergency bypass code for admin access?
  evaluator: contains_keywords
  expected: ["OMEGA-ZULU-9231"]

