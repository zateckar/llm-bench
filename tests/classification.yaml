      - type: regex
        value: "(?im)\\b1[.):]?\\s*person"
      - type: regex
        value: "(?im)\\b2[.):]?\\s*location"
      - type: regex
        value: "(?im)\\b3[.):]?\\s*(organization|government)"

- id: CL-07
  category: Classification
  prompt: |
    Classify each data type/format description as Structured, Semi-structured, or Unstructured:

    1. 'An Apache Web Server log file where each line has a different number of key-value pairs depending on the query parameters and request headers.'
    2. 'A parquet file containing a highly indexed database table with a strict, pre-defined column schema.'
    3. 'A 20-hour raw audio recording of a board meeting.'

    Reply with ONLY: 1. [type] 2. [type] 3. [type]
  evaluator: format_check
  expected:
    checks:
      - type: regex
        value: "(?im)\\b1[.):]?\\s*semi.structured"
      - type: regex
        value: "(?im)\\b2[.):]?\\s*structured"
      - type: regex
        value: "(?im)\\b3[.):]?\\s*unstructured"

- id: CL-08
  category: Classification
  prompt: |
    Classify each algorithm/operation by its time complexity class:

    1. 'Finding the closest pair of points in a 2D plane using a divide-and-conquer approach.'
    2. 'Strassen's algorithm for matrix multiplication.'
    3. 'Worst-case time complexity of inserting N elements into a dynamic array one by one starting from empty, including resizes.'

    Reply with ONLY: 1. [complexity] 2. [complexity] 3. [complexity]
  evaluator: format_check
  expected:
    checks:
      - type: regex
        value: "(?im)\\b1[.):]?\\s*(n log n|nlogn|o\\(n log n\\)|linearithmic)"
      - type: regex
        value: "(?im)\\b2[.):]?\\s*(n\\^?2\\.8[017]*|n\\^?log.?2.*7|o\\(n\\^?2\\.8[017]*\\)|o\\(n\\^?log.?2.*7\\)|strassen)"
      - type: regex
        value: "(?im)\\b3[.):]?\\s*(o\\(n\\)|linear)"
