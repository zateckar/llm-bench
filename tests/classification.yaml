# Classification / Analysis Test Suite
#
# Graded with `ordered_labels`: the label is read from the segment introduced by
# each item number, and each item carries `reject` patterns for the wrong labels.
# That closes two loopholes in the old `format_check` grading - a correct label
# under the wrong number used to count, and a response that hedged across several
# labels ("2. prototype pollution or injection or misconfiguration") matched the
# permissive alternation and passed.

- id: CL-01
  category: Classification
  difficulty: hard
  prompt: |
    Classify each statement as Factual, Opinion, or Ambiguous. "Factual" means it has a determinate
    truth value that is settled; "Opinion" means it expresses an evaluative stance; "Ambiguous" means
    its truth value is not yet determinate or depends on unstated interpretation.

    1. 'The host of the 2036 Summer Olympic Games will deliver a successful and highly profitable event.'
    2. 'Classical music is objectively superior to pop music because of its structural complexity.'
    3. 'The sentence "all prime numbers greater than two are odd" is a mathematical fact.'
    4. 'This statement is written in French.'
    5. 'The 2024 revenue figure in the attached spreadsheet is 4.2 million.'

    Reply with ONLY five lines in the form `N. label`.
  evaluator: ordered_labels
  expected:
    - index: 1
      accept: ['\bambiguous\b']
      reject: ['\bfactual\b', '\bopinion\b']
    - index: 2
      accept: ['\bopinion\b']
      reject: ['\bfactual\b', '\bambiguous\b']
    - index: 3
      accept: ['\bfactual\b']
      reject: ['\bopinion\b', '\bambiguous\b']
    - index: 4
      accept: ['\bfactual\b']
      reject: ['\bopinion\b', '\bambiguous\b']
    - index: 5
      accept: ['\bambiguous\b']
      reject: ['\bopinion\b', '\bfactual\b']

- id: CL-02
  category: Classification
  difficulty: hard
  description: "Each item has one correct OWASP 2021 category; the near-miss is rejected"
  prompt: |
    Classify each vulnerability by its OWASP Top 10 (2021) category. Use the category name, not the
    number, and give exactly one category per item.

    1. 'A web application accepts user-supplied XML templates. An attacker submits a template with an
       external DTD pointing at http://169.254.169.254/, and the server fetches and processes it,
       leaking instance credentials.'
    2. 'A Node.js service merges user-supplied JSON into a configuration object. An attacker sends
       {"__proto__": {"admin": true}}, so every object in the process gains admin = true.'
    3. 'A React app renders a database-sourced comment through dangerouslySetInnerHTML with no
       sanitisation.'
    4. 'An application logs users in successfully but never records failed logins, and has no alerting
       on credential-stuffing patterns.'
    5. 'A service pulls a dependency from a registry using a floating version tag and no integrity
       check, and the maintainer account was taken over.'

    Reply with ONLY five lines in the form `N. category`.
  evaluator: ordered_labels
  expected:
    - index: 1
      accept: ['security\s+misconfiguration', '\bxxe\b', 'xml\s+external\s+entit']
      reject: ['broken\s+access\s+control', 'cryptographic\s+failures', 'identification\s+and\s+authentication']
    - index: 2
      accept: ['prototype\s+pollution', 'software\s+and\s+data\s+integrity', 'security\s+misconfiguration', 'insecure\s+design']
      reject: ['\bxss\b', 'cross.?site\s+scripting', 'cryptographic\s+failures']
    - index: 3
      accept: ['\binjection\b', '\bxss\b', 'cross.?site\s+scripting']
      reject: ['broken\s+access\s+control', 'security\s+misconfiguration', 'cryptographic\s+failures']
    - index: 4
      accept: ['(?:security\s+)?logging\s+and\s+monitoring', 'logging\s+failures', 'insufficient\s+logging']
      reject: ['\binjection\b', 'broken\s+access\s+control', 'cryptographic\s+failures']
    - index: 5
      accept: ['software\s+and\s+data\s+integrity', 'supply\s+chain', 'vulnerable\s+and\s+outdated\s+components']
      reject: ['\binjection\b', '\bxss\b', 'broken\s+access\s+control']

- id: CL-03
  category: Classification
  difficulty: hard
  prompt: |
    Classify each description by its primary design pattern. Give exactly one pattern name per item.

    1. 'A text editor stores characters as shared immutable objects; formatting is not stored per
       character but passed in as context during rendering.'
    2. 'A compiler needs to run many different operations over a fixed AST node hierarchy without
       modifying the node classes, so it defines an interface with one method per node type.'
    3. 'A system wraps each user action as an object so clients can be parameterised with different
       actions, and so actions can be queued, logged and undone.'
    4. 'A subsystem exposes one simplified entry point that hides a dozen collaborating classes behind
       it, without adding new behaviour.'
    5. 'An object changes which algorithm it uses for a step of its work by delegating to an
       interchangeable helper chosen at runtime.'

    Reply with ONLY five lines in the form `N. pattern`.
  evaluator: ordered_labels
  expected:
    - index: 1
      accept: ['\bflyweight\b']
      reject: ['\bsingleton\b', '\bprototype\b', '\bproxy\b', '\bdecorator\b']
    - index: 2
      accept: ['\bvisitor\b']
      reject: ['\bstrategy\b', '\bcommand\b', '\bobserver\b', '\btemplate method\b']
    - index: 3
      accept: ['\bcommand\b']
      reject: ['\bstrategy\b', '\bvisitor\b', '\bobserver\b', '\bmemento\b']
    - index: 4
      accept: ['\bfa[cç]ade\b']
      reject: ['\badapter\b', '\bproxy\b', '\bdecorator\b', '\bbridge\b']
    - index: 5
      accept: ['\bstrategy\b']
      reject: ['\bstate\b', '\bcommand\b', '\bvisitor\b', '\btemplate method\b']

- id: CL-04
  category: Classification
  difficulty: hard
  prompt: |
    Classify each error message by its most likely single cause. Give exactly one cause per item, using
    the shortest precise term.

    1. 'Access to fetch at "https://api.example.com/data" from origin "https://app.example.com" has
       been blocked by CORS policy: no "Access-Control-Allow-Origin" header is present.'
    2. 'sqlite3.OperationalError: database is locked'
    3. 'ssl.SSLCertVerificationError: [SSL: CERTIFICATE_VERIFY_FAILED] self-signed certificate in
       certificate chain'
    4. 'Container failed to start. Error: OOMKilled'
    5. 'psycopg2.OperationalError: FATAL: remaining connection slots are reserved for non-replication
       superuser connections'
    6. 'error: RPC failed; HTTP 413 curl 22 The requested URL returned error: 413'

    Reply with ONLY six lines in the form `N. cause`.
  evaluator: ordered_labels
  expected:
    - index: 1
      accept: ['\bcors\b', 'cross.?origin']
      reject: ['\bdns\b', 'certificate', 'timeout', 'authenticat']
    - index: 2
      accept: ['\block(?:ed|ing)?\b', 'concurren', 'write contention', '\bbusy\b']
      reject: ['\bcors\b', 'out of memory', 'certificate']
    - index: 3
      accept: ['certificat', '\bssl\b', '\btls\b', 'self.?signed', 'trust store']
      reject: ['\bcors\b', 'out of memory', '\block\b']
    - index: 4
      accept: ['out of memory', '\boom\b', 'memory limit', 'memory']
      reject: ['\bcors\b', 'certificate', '\bcpu\b', 'disk']
    - index: 5
      accept: ['connection (?:limit|slot|pool|exhaust)', 'max_connections', 'too many connections']
      reject: ['out of memory', 'certificate', '\bcors\b', 'authenticat']
    - index: 6
      accept: ['(?:payload|body|request|push|file)\s+too\s+large', 'size limit', 'max(?:imum)?\s+(?:body|upload|request)\s+size', '\b413\b']
      reject: ['authenticat', 'certificate', '\bcors\b', 'out of memory']

- id: CL-05
  category: Classification
  difficulty: hard
  description: "Same surface form, three different entity types, decided by context"
  prompt: |
    Classify each use of the highlighted name as Person, Location, or Organization.

    1. 'Washington's leadership at Valley Forge held the army together through the winter.'
    2. 'Washington is known for its rainy weather and evergreen forests.'
    3. 'Washington has issued a statement condemning the recent military actions.'
    4. 'Amazon rerouted its delivery vans around the flooded interchange.'
    5. 'The Amazon lost a further 11,000 square kilometres of canopy last year.'

    Reply with ONLY five lines in the form `N. type`.
  evaluator: ordered_labels
  expected:
    - index: 1
      accept: ['\bperson\b']
      reject: ['\blocation\b', '\borganization\b', '\borganisation\b']
    - index: 2
      accept: ['\blocation\b']
      reject: ['\bperson\b', '\borganization\b', '\borganisation\b']
    - index: 3
      accept: ['\borganization\b', '\borganisation\b', '\bgovernment\b']
      reject: ['\bperson\b', '\blocation\b']
    - index: 4
      accept: ['\borganization\b', '\borganisation\b', '\bcompany\b']
      reject: ['\bperson\b', '\blocation\b']
    - index: 5
      accept: ['\blocation\b']
      reject: ['\bperson\b', '\borganization\b', '\borganisation\b']

- id: CL-06
  category: Classification
  difficulty: hard
  prompt: |
    Classify each data description as Structured, Semi-structured, or Unstructured.

    1. 'An Apache access log where each line carries a different number of key-value pairs depending on
       the query parameters and headers present.'
    2. 'A Parquet file holding a database table with a strict pre-declared column schema.'
    3. 'A 20-hour raw audio recording of a board meeting.'
    4. 'A directory of JSON documents that share a few common fields but otherwise vary freely.'
    5. 'A fixed-width COBOL data file whose record layout is defined by a copybook.'

    Reply with ONLY five lines in the form `N. type`.
  evaluator: ordered_labels
  expected:
    - index: 1
      accept: ['semi.?structured']
      reject: ['\bunstructured\b', '(?<!semi.)(?<!semi )\bstructured\b']
    - index: 2
      accept: ['(?<!semi.)(?<!semi )\bstructured\b']
      reject: ['\bunstructured\b', 'semi.?structured']
    - index: 3
      accept: ['\bunstructured\b']
      reject: ['semi.?structured', '(?<!un)(?<!semi.)(?<!semi )\bstructured\b']
    - index: 4
      accept: ['semi.?structured']
      reject: ['\bunstructured\b', '(?<!semi.)(?<!semi )\bstructured\b']
    - index: 5
      accept: ['(?<!semi.)(?<!semi )\bstructured\b']
      reject: ['\bunstructured\b', 'semi.?structured']

- id: CL-07
  category: Classification
  difficulty: expert
  prompt: |
    Classify each operation by its tight asymptotic complexity class in terms of n. Give exactly one
    class per item using big-O notation.

    1. 'Finding the closest pair of points in a 2D plane by divide and conquer.'
    2. "Strassen's algorithm for multiplying two n x n matrices."
    3. 'Inserting n elements one by one into an initially empty dynamic array, counting all resizes -
       total cost for all n insertions.'
    4. 'Building a binary heap from an unsorted array of n elements using the bottom-up heapify method.'
    5. 'Finding the median of an unsorted array using the median-of-medians selection algorithm, worst
       case.'
    6. 'Answering n union and find operations on n elements with union by rank and path compression -
       total cost.'

    Reply with ONLY six lines in the form `N. O(...)`.
  evaluator: ordered_labels
  expected:
    - index: 1
      accept: ['o\s*\(\s*n\s*log\s*n\s*\)', 'n\s*log\s*n', 'linearithmic']
      reject: ['o\s*\(\s*n\s*\^?\s*2', 'o\s*\(\s*n\s*\)\s*$']
    - index: 2
      accept: ['n\s*\^?\s*2\.8', 'n\s*\^?\s*\{?\s*log\s*_?\s*2\s*7', 'log\s*2\s*\(?\s*7']
      reject: ['o\s*\(\s*n\s*\^?\s*3\s*\)', 'o\s*\(\s*n\s*log\s*n\s*\)']
    - index: 3
      accept: ['o\s*\(\s*n\s*\)', '\blinear\b', 'amorti[sz]ed\s+o\s*\(\s*1\s*\)']
      reject: ['o\s*\(\s*n\s*\^?\s*2', 'o\s*\(\s*n\s*log\s*n\s*\)']
    - index: 4
      accept: ['o\s*\(\s*n\s*\)', '\blinear\b']
      reject: ['o\s*\(\s*n\s*log\s*n\s*\)', 'o\s*\(\s*log\s*n\s*\)']
    - index: 5
      accept: ['o\s*\(\s*n\s*\)', '\blinear\b']
      reject: ['o\s*\(\s*n\s*log\s*n\s*\)', 'o\s*\(\s*n\s*\^?\s*2']
    - index: 6
      accept: ['inverse\s+ackermann', 'alpha\s*\(\s*n\s*\)', 'α\s*\(\s*n\s*\)', 'n\s*\*?\s*(?:inverse\s+)?ackermann', 'near(?:ly)?[- ]linear', 'amorti[sz]ed\s+(?:almost|nearly)\s+constant']
      reject: ['o\s*\(\s*n\s*log\s*n\s*\)', 'o\s*\(\s*n\s*\^?\s*2']
