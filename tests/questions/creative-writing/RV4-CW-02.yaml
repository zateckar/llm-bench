- id: RV4-CW-02
  category: Creative Writing
  prompt: Write four lines about a small mystery. Each line has exactly 5 whitespace-separated words. Start the
    lines with I, You, We, They respectively and end them with key, bell, bridge, lantern respectively. No title,
    blank lines, or commentary. Only constraint compliance is scored, not artistic quality.
  evaluator: format_check
  expected:
    checks:
    - type: line_count
      value: 4
    - type: every_line_word_count
      value: 5
    - type: regex
      value: \A(?:[^\n]*\n){0}I\b[^\n]*\bkey[.!?]?(?:\n|$)
    - type: regex
      value: \A(?:[^\n]*\n){1}You\b[^\n]*\bbell[.!?]?(?:\n|$)
    - type: regex
      value: \A(?:[^\n]*\n){2}We\b[^\n]*\bbridge[.!?]?(?:\n|$)
    - type: regex
      value: \A(?:[^\n]*\n){3}They\b[^\n]*\blantern[.!?]?(?:\n|$)
  pass_threshold: 1.0
  difficulty: hard
  source: reliability-v4; compliance only
  max_tokens: 16384
  metadata:
    family: R8A-RV4-CW-02
    cohort: rigorous-v9
    original_anchor_id: RV4-CW-02
