  - {id: 'json:[1].args.if_match', weight: 0.1111111111111111, group: answer, mandatory: true, critical: false,
    dimension: content}
  - {id: 'json:[1].args.body.owner', weight: 0.1111111111111111, group: answer, mandatory: true, critical: false,
    dimension: content}
  - {id: 'json:[1].args.body.labels[0]', weight: 0.1111111111111111, group: answer, mandatory: true, critical: false,
