  - {id: 'json:[0].args.path', weight: 0.1, group: answer, mandatory: true, critical: false, dimension: content}
  - {id: 'json:[0].args.revision', weight: 0.1, group: answer, mandatory: true, critical: false, dimension: content}
  - {id: 'json:[1].tool', weight: 0.1, group: answer, mandatory: true, critical: false, dimension: content}
  - {id: 'json:[1].args.path', weight: 0.1, group: answer, mandatory: true, critical: false, dimension: content}
  - {id: 'json:[1].args.base', weight: 0.1, group: answer, mandatory: true, critical: false, dimension: content}
  - {id: 'json:[1].args.old', weight: 0.1, group: answer, mandatory: true, critical: false, dimension: content}
