  - {id: 'json:rounds[1].A', weight: 0.1111111111111111, group: rounds, mandatory: true, critical: false, dimension: content}
  - {id: 'json:rounds[1].B', weight: 0.1111111111111111, group: rounds, mandatory: true, critical: false, dimension: content}
  - {id: 'json:rounds[1].D', weight: 0.1111111111111111, group: rounds, mandatory: true, critical: false, dimension: content}
  - {id: 'json:rounds[2].A', weight: 0.1111111111111111, group: rounds, mandatory: true, critical: false, dimension: content}
  - {id: 'json:rounds[2].D', weight: 0.1111111111111111, group: rounds, mandatory: true, critical: false, dimension: content}
