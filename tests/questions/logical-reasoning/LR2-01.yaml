- id: LR2-01
  category: Logical Reasoning
  prompt: |-
    Arrange A,B,C,D,E,F,G in seven positions, using each letter exactly once.
    A is before D, D is before G, B is before E, and E is before G.
    Exactly one letter lies between C and F. B is not first. A and B are not adjacent.
    Return a JSON object with count (the number of valid arrangements), first
    (lexicographically smallest arrangement), and last (lexicographically largest).
    Represent each arrangement as a seven-letter string. Use alphabetic order A < B < ... < G.

    Explicit JSON output contract (types only): {"count": "number", "first": "string", "last": "string"}
  evaluator: json_match
  expected:
    value:
      count: 24
      first: ACBFDEG
      last: FBCEADG
    mode: exact
    strict_json: true
  pass_threshold: 1.0
  difficulty: expert
  source: challenge-v2
  description: Count all linear arrangements under interacting constraints
  max_tokens: 8192
  metadata:
    family: R8A-LR2-01
    cohort: rigorous-v9
    original_anchor_id: LR2-01
  rubric:
  - {id: 'json:count', weight: 1.0, group: count, mandatory: true, critical: false, dimension: content}
  - {id: 'json:first', weight: 1.0, group: first, mandatory: true, critical: false, dimension: content}
  - {id: 'json:last', weight: 1.0, group: last, mandatory: true, critical: false, dimension: content}
