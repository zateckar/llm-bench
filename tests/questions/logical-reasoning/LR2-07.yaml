- id: LR2-07
  category: Logical Reasoning
  prompt: |-
    The possible dates are Apr-11, Apr-14, Apr-17, Jun-12, Jun-16, Sep-11,
    Sep-13, Dec-13, Dec-14, Dec-12. M knows only the month and D only the day.
    Both are perfect logicians; the list and these rules are common knowledge.
    M: "I do not know the date, and I know D does not know it."
    D: "Before that statement I did not know, but now I know."
    M: "Now I know too."
    Each statement is truthful and incorporates all earlier public statements.
    Return JSON {"remaining_counts": [number of dates after statement 1, after
    statement 2, after statement 3], "dates": [all final dates in lexical order]}.
    Use date strings exactly as given.

    Explicit JSON output contract (types only): {"remaining_counts": {"array_items": "number"}, "dates": {"array_items": "string"}}
  evaluator: json_match
