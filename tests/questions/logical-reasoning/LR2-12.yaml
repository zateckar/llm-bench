    value:
      cost: 21
      assignments: ['42153', '52143']
    mode: exact
    strict_json: true
  pass_threshold: 1.0
  difficulty: expert
  source: challenge-v2
  description: Assignment optimization with forbidden pairs and coupled constraint
  max_tokens: 8192
