    dimension: content}
  - {id: 'json:snapshot_commits[2]', weight: 0.3333333333333333, group: snapshot_commits, mandatory: true, critical: false,
    dimension: content}
  - {id: 'json:snapshot_final.a', weight: 0.3333333333333333, group: snapshot_final, mandatory: true, critical: false,
    dimension: content}
  - {id: 'json:snapshot_final.b', weight: 0.3333333333333333, group: snapshot_final, mandatory: true, critical: false,
    dimension: content}
  - {id: 'json:snapshot_final.c', weight: 0.3333333333333333, group: snapshot_final, mandatory: true, critical: false,
