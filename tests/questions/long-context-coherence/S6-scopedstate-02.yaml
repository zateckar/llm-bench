- id: S6-scopedstate-02
  category: Long Context Coherence
  prompt: |-
    Follow a nested configuration session. The root initially has color=11, quota=22, region=33.
    push creates an EMPTY child overlay; reads inherit through parents. set writes only the
    current overlay. unset writes an explicit null mask: reads return null, not a parent's
    value. commit pops the child and copies only its explicit entries (including null masks)
    into its parent. rollback pops and discards the child. Neither operation pops the root.
    read records visible [color,quota,region]. All operations below are valid and ordered.
    The final stack has only the root. Integer values are opaque configuration data.
    Operations: [["push"],["set","quota",57],["push"],["unset","color"],["read"],["rollback"],["read"],["commit"],["read"],["push"],["set","color",90],["push"],["unset","quota"],["read"],["rollback"],["read"],["commit"],["read"],["push"],["set","color",40],["push"],["unset","color"],["read"],["rollback"],["read"],["commit"],["read"],["push"],["set","quota",78],["push"],["unset","color"],["read"],["commit"],["read"],["commit"],["read"],["push"],["set","region",16],["push"],["unset","quota"],["read"],["rollback"],["read"],["commit"],["read"],["push"],["set","color",20],["push"],["unset","quota"],["read"],["commit"],["read"],["commit"],["read"]]
    Return reads (one three-element array for every read in chronological order) and root
    (final explicit root entries for color,quota,region). Do not conflate null with inheritance.
    Return only one JSON object with exactly the requested keys. Arrays have the order specified above; do not add prose.
    Explicit JSON output contract (types only): {"reads": "array (element types and order specified in task)", "root": {"color": "number", "quota": "null or the value type specified in task", "region": "number"}}
    root is {color:value_or_null,quota:value_or_null,region:value_or_null}, never an array.
  evaluator: json_match
  expected:
    value:
      reads: [[null, 57, 33], [11, 57, 33], [11, 57, 33], [90, null, 33], [90, 57, 33], [90, 57, 33], [null, 57,
          33], [40, 57, 33], [40, 57, 33], [null, 78, 33], [null, 78, 33], [null, 78, 33], [null, null, 16], [null,
          78, 16], [null, 78, 16], [20, null, 16], [20, null, 16], [20, null, 16]]
      root:
        color: 20
        quota: null
        region: 16
    mode: exact
    strict_json: true
  pass_threshold: 1.0
  difficulty: expert
  source: 'Original stretch-v6; design inspiration: https://github.com/google-deepmind/bbeh'
  description: Compositional task with an executable oracle; difficulty needs fresh calibration.
  max_tokens: 65536
  metadata:
    family: R8A-S6-scopedstate
    cohort: rigorous-v9
    original_anchor_id: S6-scopedstate-02
