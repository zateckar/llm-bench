- id: H5-TN-randomization-01
  category: Terminal Science
  prompt: |-
    A paired randomized experiment has eight independently randomized blocks.
    The observed treatment-minus-control differences are [4, -8, -5, 1, -5, -1, -3, -5]; PRE-SPECIFIED
    integer weights are [3, 3, 2, 2, 2, 1, 2, 3]. Test statistic is the absolute weighted SUM, not a
    mean of signs. Under the sharp null, independently swap treatment/control labels in
    each block: all 256 sign-flip vectors are equally likely, even when vectors yield
    the same statistic. Exact two-sided p is proportion with statistic >= observed.
    Count ties as extreme; do not add an extra pseudo-observation. Each block contains
    100 repeated measurements, which do not increase the number of randomized blocks.
    Return {"independent_units":integer,"observed_statistic":integer,"extreme_vectors":integer,
    "p":{"numerator":integer,"denominator":integer},"reject_at_0_05":bool,
    "causal_effect_in_unstudied_population_established":bool}. Reduce p. No transportability
    assumptions or data about any other population are supplied.
    Return only the requested JSON, with no extra keys or prose. Null is allowed only where explicitly requested. All ID lists must be sorted lexicographically.
    Explicit JSON output contract (types only): {"independent_units": "number", "observed_statistic": "number", "extreme_vectors": "number", "p": {"numerator": "number", "denominator": "number"}, "reject_at_0_05": "boolean", "causal_effect_in_unstudied_population_established": "boolean"}
  evaluator: json_match
  expected:
    value:
      independent_units: 8
      observed_statistic: 52
      extreme_vectors: 38
      p:
        numerator: 19
        denominator: 128
      reject_at_0_05: false
      causal_effect_in_unstudied_population_established: false
    mode: exact
    strict_json: true
  pass_threshold: 1.0
  difficulty: expert
  source: 'Original ceiling-v5; BBEH: https://github.com/google-deepmind/bbeh (compositional reasoning design only)'
  description: Compositional challenge; deterministic oracle in hard_cases.py. Difficulty awaits fresh model calibration.
  max_tokens: 16384
  metadata:
    family: R8A-H5-TN-randomization
    cohort: rigorous-v9
    original_anchor_id: H5-TN-randomization-01
  rubric:
  - {id: 'json:independent_units', weight: 1.0, group: independent_units, mandatory: true, critical: false, dimension: content}
  - {id: 'json:observed_statistic', weight: 1.0, group: observed_statistic, mandatory: true, critical: false, dimension: content}
  - {id: 'json:extreme_vectors', weight: 1.0, group: extreme_vectors, mandatory: true, critical: false, dimension: content}
  - {id: 'json:p.numerator', weight: 0.5, group: p, mandatory: true, critical: false, dimension: content}
  - {id: 'json:p.denominator', weight: 0.5, group: p, mandatory: true, critical: false, dimension: content}
  - {id: 'json:reject_at_0_05', weight: 1.0, group: reject_at_0_05, mandatory: true, critical: false, dimension: content}
  - {id: 'json:causal_effect_in_unstudied_population_established', weight: 1.0, group: causal_effect_in_unstudied_population_established,
    mandatory: true, critical: false, dimension: content}
