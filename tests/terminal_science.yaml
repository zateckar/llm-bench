# Terminal Scientific Computing Test Suite
#
# Previously every item here was "explain topic X" graded against patterns like
# "attention|weight|softmax|query|key" - a paragraph of jargon scored full marks.
# Each item now targets the computational core of its topic and is graded by
# running the code, except the two where the difficulty genuinely is the
# reasoning, which are graded on named assumptions and specific methods.

- id: TN-01
  category: Terminal Science
  difficulty: hard
  source: terminal-bench/cartpole-rl-training
  description: "Numerical stability: the naive exp/sum implementation overflows"
  prompt: |
    Write a Python function `stable_softmax(logits: list[float]) -> list[float]` that computes the
    softmax of a vector. It must be numerically stable: it must return correct probabilities even for
    logits with magnitudes around 1000, where a naive exp-then-normalise implementation overflows to
    inf and yields nan. Do not use numpy or scipy.
    Reply with ONLY the Python code in a code block.
  evaluator: code_exec
  expected:
    - function: stable_softmax
      args: [[0.0, 0.0]]
      expected: [0.5, 0.5]
      tolerance: 1.0e-9
    - function: stable_softmax
      args: [[1000.0, 1000.0]]
      expected: [0.5, 0.5]
      tolerance: 1.0e-9
    - function: stable_softmax
      args: [[1.0, 2.0, 3.0]]
      expected: [0.09003057317038046, 0.24472847105479764, 0.6652409557748218]
      tolerance: 1.0e-9
    - function: stable_softmax
      args: [[-1000.0, -1000.0, -1000.0]]
      expected: [0.3333333333333333, 0.3333333333333333, 0.3333333333333333]
      tolerance: 1.0e-9
    - function: stable_softmax
      args: [[0.0]]
      expected: [1.0]
      tolerance: 1.0e-12

- id: TN-02
  category: Terminal Science
  difficulty: hard
  source: terminal-bench/dna-assembly
  description: "Golden Gate assembly reduced to its checkable core: BsaI site detection"
  prompt: |
    Golden Gate assembly with BsaI requires knowing where the enzyme cuts. BsaI recognises GGTCTC
    and, on the opposite strand, GAGACC.

    Write two Python functions:
      - `reverse_complement(seq: str) -> str` for an uppercase DNA string over A, C, G, T.
      - `find_bsai_sites(seq: str) -> list[int]` returning the sorted 0-based start indices of every
        occurrence of GGTCTC or GAGACC in the sequence, including overlapping occurrences.

    Reply with ONLY the Python code in a code block.
  evaluator: code_exec
  expected:
    - function: reverse_complement
      args: ["ATGC"]
      expected: "GCAT"
    - function: reverse_complement
      args: [""]
      expected: ""
    - function: reverse_complement
      args: ["AATT"]
      expected: "AATT"
    - function: reverse_complement
      args: ["GGTCTC"]
      expected: "GAGACC"
    - function: find_bsai_sites
      args: ["AAAGGTCTCAAA"]
      expected: [3]
    - function: find_bsai_sites
      args: ["GAGACCTTT"]
      expected: [0]
    - function: find_bsai_sites
      args: ["GGTCTCGAGACC"]
      expected: [0, 6]
    - function: find_bsai_sites
      args: ["AAAA"]
      expected: []

- id: TN-03
  category: Terminal Science
  difficulty: medium
  source: terminal-bench/chem-property-targeting
  description: "Boundary conditions of the Rule of Five are inclusive"
  prompt: |
    Lipinski's Rule of Five flags a compound when any of these thresholds is exceeded: molecular
    weight above 500 Da, cLogP above 5, more than 5 hydrogen-bond donors, more than 10 hydrogen-bond
    acceptors. Values exactly at a threshold are NOT violations.

    Write a Python function `lipinski_violations(mw: float, logp: float, hbd: int, hba: int) -> int`
    returning how many of the four criteria are violated.
    Reply with ONLY the Python code in a code block.
  evaluator: code_exec
  expected:
    - function: lipinski_violations
      args: [300.0, 2.0, 2, 5]
      expected: 0
    - function: lipinski_violations
      args: [600.0, 6.0, 6, 11]
      expected: 4
    - function: lipinski_violations
      args: [500.0, 5.0, 5, 10]
      expected: 0
    - function: lipinski_violations
      args: [501.0, 5.0, 5, 10]
      expected: 1
    - function: lipinski_violations
      args: [499.0, 5.1, 5, 11]
      expected: 2

- id: TN-04
  category: Terminal Science
  difficulty: hard
  source: terminal-bench/attention-mil
  description: "Attention pooling: a weighted sum whose weights must be a stable softmax"
  prompt: |
    In attention-based Multiple Instance Learning, a bag-level representation is the attention-weighted
    sum of its instance features, where the attention weights are a softmax over per-instance scores.

    Write a Python function `attention_pooling(features: list[list[float]], scores: list[float]) -> list[float]`
    returning the pooled feature vector. `features[i]` is the feature vector of instance i and
    `scores[i]` its attention score. The softmax must be numerically stable for scores around 1000.
    Do not use numpy.
    Reply with ONLY the Python code in a code block.
  evaluator: code_exec
  expected:
    - function: attention_pooling
      args: [[[1.0, 2.0], [3.0, 4.0]], [0.0, 0.0]]
      expected: [2.0, 3.0]
      tolerance: 1.0e-9
    - function: attention_pooling
      args: [[[1.0, 0.0], [0.0, 1.0]], [1000.0, 0.0]]
      expected: [1.0, 0.0]
      tolerance: 1.0e-9
    - function: attention_pooling
      args: [[[5.0]], [42.0]]
      expected: [5.0]
      tolerance: 1.0e-12
    - function: attention_pooling
      args: [[[0.0, 0.0], [10.0, 20.0]], [0.0, 1000.0]]
      expected: [10.0, 20.0]
      tolerance: 1.0e-9

- id: TN-05
  category: Terminal Science
  difficulty: expert
  source: terminal-bench/causal-inference-r
  description: "Graded on naming the identifying assumptions, not on listing method names"
  prompt: |
    You have observational data and want a causal effect estimate. For each of the three methods
    below, state the specific identifying assumption that must hold and name the R function or
    package you would use:

      1. Propensity score matching
      2. Instrumental variables
      3. Difference-in-differences

    Then state explicitly what each method cannot fix.
  evaluator: multi_step_solution
  expected:
    steps:
      - step: "Propensity matching assumption: no unmeasured confounding / ignorability"
        pattern: '(?:no unmeasured confound|unconfoundedness|ignorab|conditional independence|strong ignorability|selection on observables)[\s\S]{0,400}(?:MatchIt|matchit|Matching|twang|WeightIt)'
        order: 1
      - step: "IV assumptions: relevance and exclusion restriction"
        pattern: '(?:exclusion restriction)[\s\S]{0,400}(?:AER|ivreg|ivreg2|feols|estimatr|iv_robust)'
        order: 2
      - step: "DiD assumption: parallel trends"
        pattern: 'parallel trends|common trends'
        order: 3
      - step: "States the residual limitation"
        pattern: '(?:cannot|can.?t|does not|doesn.?t|unable to)[\s\S]{0,120}(?:unmeasured|unobserved|latent|hidden) confound'
        order: 4
    must_not:
      # Matching on observables does not address unobserved confounding.
      - '(?i)propensity score matching (?:removes|eliminates|controls for|handles) (?:all )?(?:unobserved|unmeasured) confound'
      - '(?i)correlation (?:does )?impl(?:y|ies) causation'

- id: TN-06
  category: Terminal Science
  difficulty: expert
  source: terminal-bench/fmri-encoding-r
  description: "Must get the direction of encoding vs decoding right and name the leakage trap"
  prompt: |
    Explain voxel-wise encoding models for fMRI:
      1. State precisely what an encoding model predicts and from what, and contrast it with a
         decoding model (be explicit about which is the input and which is the output in each case).
      2. Describe how the stimulus is turned into a design matrix, including convolution with the
         haemodynamic response.
      3. Explain why ordinary least squares is usually replaced by a regularised estimator here, and
         name the estimator.
      4. Describe the cross-validation scheme, and name the specific leakage risk that naive k-fold
         cross-validation introduces for fMRI time series.
  evaluator: multi_step_solution
  expected:
    steps:
      - step: "Encoding predicts brain response FROM stimulus features"
        pattern: '(?:encoding)[\s\S]{0,200}(?:predict|model|map)[\s\S]{0,120}(?:brain|voxel|BOLD|neural) (?:response|activity|signal)'
        order: 1
      - step: "Decoding is the reverse direction"
        pattern: '(?:decoding)[\s\S]{0,200}(?:predict|infer|recover|reconstruct)[\s\S]{0,120}(?:stimulus|feature|percept|category)'
        order: 2
      - step: "Design matrix convolved with the HRF"
        pattern: '(?:convolv|convolution)[\s\S]{0,120}(?:h(?:a)?emodynamic|HRF)'
        order: 3
      - step: "Regularised estimator named"
        pattern: '\bridge\b|\bL2\b|banded ridge|\blasso\b|elastic net|Tikhonov'
        order: 4
      - step: "Temporal autocorrelation leakage in naive k-fold"
        pattern: '(?:autocorrel|temporal(?:ly)? (?:depend|correlat)|adjacent (?:TRs|volumes|timepoints)|contiguous (?:runs|blocks)|block(?:ed)?[- ]wise|leave-one-run-out)'
        order: 5
    must_not:
      - '(?i)encoding models predict the stimulus from (?:the )?(?:brain|voxel|BOLD)'

- id: TN-07
  category: Terminal Science
  difficulty: hard
  source: terminal-bench/chem-rf
  description: "The split criterion behind a random forest, computed exactly"
  prompt: |
    Write two Python functions used when growing a decision tree:

      - `gini_impurity(labels: list) -> float` - the Gini impurity of a label list. An empty list has
        impurity 0.0.
      - `information_gain(parent: list, left: list, right: list) -> float` - the Gini-based gain,
        i.e. the parent's impurity minus the size-weighted average impurity of the two children.

    Do not use numpy or scikit-learn.
    Reply with ONLY the Python code in a code block.
  evaluator: code_exec
  expected:
    - function: gini_impurity
      args: [[0, 0, 1, 1]]
      expected: 0.5
      tolerance: 1.0e-12
    - function: gini_impurity
      args: [[0, 0, 0, 0]]
      expected: 0.0
      tolerance: 1.0e-12
    - function: gini_impurity
      args: [[]]
      expected: 0.0
      tolerance: 1.0e-12
    - function: gini_impurity
      args: [[0, 1, 2]]
      expected: 0.6666666666666667
      tolerance: 1.0e-9
    - function: information_gain
      args: [[0, 0, 1, 1], [0, 0], [1, 1]]
      expected: 0.5
      tolerance: 1.0e-12
    - function: information_gain
      args: [[0, 0, 1, 1], [0, 1], [0, 1]]
      expected: 0.0
      tolerance: 1.0e-12

- id: TN-08
  category: Terminal Science
  difficulty: expert
  source: terminal-bench/bn-fit-modify
  description: "Markov blanket must include co-parents, which is the part usually missed"
  prompt: |
    In a Bayesian network, a node's Markov blanket is the union of its parents, its children, and the
    other parents of its children (its children's co-parents).

    Write a Python function `markov_blanket(graph: dict, node: str) -> list[str]` where `graph` maps
    each node name to the list of its parent node names. Return the Markov blanket as a
    lexicographically sorted list, excluding the node itself.
    Reply with ONLY the Python code in a code block.
  evaluator: code_exec
  expected:
    - function: markov_blanket
      args: [{"A": [], "B": ["A"], "C": ["A"], "D": ["B", "C"], "E": ["D"]}, "B"]
      expected: ["A", "C", "D"]
    - function: markov_blanket
      args: [{"A": [], "B": ["A"], "C": ["A"], "D": ["B", "C"], "E": ["D"]}, "A"]
      expected: ["B", "C"]
    - function: markov_blanket
      args: [{"A": [], "B": ["A"], "C": ["A"], "D": ["B", "C"], "E": ["D"]}, "E"]
      expected: ["D"]
    - function: markov_blanket
      args: [{"A": [], "B": ["A"], "C": ["A"], "D": ["B", "C"], "E": ["D"]}, "D"]
      expected: ["B", "C", "E"]
    - function: markov_blanket
      args: [{"X": []}, "X"]
      expected: []

- id: TN-09
  category: Terminal Science
  difficulty: expert
  description: "Multiple-testing correction: only genes with p < 5e-6 survive Bonferroni, not all 'significant' ones"
  prompt: |
    A genomics study performs exactly 10,000 independent two-sided hypothesis tests, one per gene, and
    obtains this p-value distribution:
      - 5 genes with p < 1e-6
      - 35 further genes with p in [1e-6, 5e-6)
      - 60 further genes with p in [5e-6, 5e-5)

    Answer both, then end your reply with a single line in exactly this format:
    `ANSWERS: <a>, <b>`
    (a) Using a Bonferroni correction to control the family-wise error rate at alpha = 0.05, how many
        genes are called significant?
    (b) Using the naive per-test threshold alpha = 0.05 with no correction, and assuming null genes
        produce uniformly distributed p-values and the 100 listed genes are all true alternatives,
        how many false positives would you expect at that threshold, in addition to the 100 true ones?
  evaluator: regex_all
  expected:
    patterns:
      # (a) threshold = 0.05/10000 = 5e-6, so 5 + 35 = 40 genes have p < 5e-6
      - '(?im)^\s*ANSWERS:\s*40\s*,\s*495\s*\.?\s*$'
    must_not:
      # (a) accepting all 100 'statistically significant at alpha' genes is the classic error
      - '(?i)^.*ANSWERS:\s*100'
      # (b) 500 false positives (0.05 * 9900) is the naive error; correct is 495 or ~495
      - '(?im)^\s*ANSWERS:\s*40\s*,\s*500\s*\.?\s*$'

- id: TN-10
  category: Terminal Science
  difficulty: expert
  description: "Rank-correlation subtleties: ties must be handled, and sign must be preserved"
  prompt: |
    Write a Python function `spearman_rho(x: list[float], y: list[float]) -> float` computing
    Spearman's rank correlation coefficient between two equal-length sequences. It must handle tied
    values by assigning them their average (mid-)rank, return the signed Pearson coefficient of those
    ranks (0 when a sequence is constant), and not use scipy or numpy. Assume len(x) == len(y) >= 2.
    Reply with ONLY the Python code in a code block.
  evaluator: code_exec
  expected:
    - function: spearman_rho
      args: [[1, 2, 3, 4, 5], [2, 4, 6, 8, 10]]
      expected: 1.0
      tolerance: 1.0e-9
    - function: spearman_rho
      args: [[1, 2, 3, 4, 5], [5, 4, 3, 2, 1]]
      expected: -1.0
      tolerance: 1.0e-9
    - function: spearman_rho
      args: [[1, 1, 2, 2, 3], [1, 2, 3, 4, 5]]
      expected: 0.9486832980505138
      tolerance: 1.0e-6
    - function: spearman_rho
      args: [[1, 2, 3], [3, 2, 1]]
      expected: -1.0
      tolerance: 1.0e-9
    - function: spearman_rho
      args: [[1, 1, 1], [2, 3, 4]]
      expected: 0.0
      tolerance: 1.0e-9
