# Terminal Debugging Test Suite
#
# Most items are now real defects with executable fixtures: the model must
# produce code that actually behaves correctly, not prose that happens to
# contain the words "permission" and "PATH". The two remaining explanation items
# are graded with narrow patterns plus `must_not` rules that reject the specific
# wrong answers models give.

- id: TD-01
  category: Terminal Debugging
  difficulty: medium
  description: "Two defects: an off-by-one window bound and a zero-initialised maximum"
  prompt: |
    This function is supposed to return the sum of the maximum-sum contiguous subarray of length
    exactly k. It is wrong in more than one way. Fix it.

    ```python
    def max_subarray_sum(nums, k):
        best = 0
        for i in range(len(nums) - k):
            best = max(best, sum(nums[i:i + k]))
        return best
    ```

    Assume 1 <= k <= len(nums). Reply with ONLY the corrected function in a Python code block.
  evaluator: code_exec
  expected:
    - function: max_subarray_sum
      args: [[1, 2, 3, 4, 5], 2]
      expected: 9
    - function: max_subarray_sum
      args: [[-1, -2, -3], 2]
      expected: -3
    - function: max_subarray_sum
      args: [[5], 1]
      expected: 5
    - function: max_subarray_sum
      args: [[2, 2, 2], 3]
      expected: 6
    - function: max_subarray_sum
      args: [[-5, -1, -5], 1]
      expected: -1

- id: TD-02
  category: Terminal Debugging
  difficulty: medium
  description: "Mutable default argument; the fixtures run in one process so the leak shows"
  prompt: |
    Users report that this function accumulates results across unrelated calls. Fix it so each call
    with no explicit bucket starts from an empty list, while still allowing a caller-supplied bucket.

    ```python
    def add_item(item, bucket=[]):
        bucket.append(item)
        return bucket
    ```

    Reply with ONLY the corrected function in a Python code block.
  evaluator: code_exec
  expected:
    - function: add_item
      args: [1]
      expected: [1]
    - function: add_item
      args: [2]
      expected: [2]
    - function: add_item
      args: [3, [9]]
      expected: [9, 3]
    - function: add_item
      args: ["x"]
      expected: ["x"]

- id: TD-03
  category: Terminal Debugging
  difficulty: hard
  source: terminal-bench/fix-code-vulnerability
  description: "Must name the CWE, parameterise, and not recommend escaping as the fix"
  prompt: |
    A Python web application builds SQL like this:

    ```python
    query = f"SELECT * FROM users WHERE username = '{username}'"
    cursor.execute(query)
    ```

    1. Identify the vulnerability class and its CWE number.
    2. Explain concretely what an attacker can do.
    3. Provide the corrected code.
    4. Explain why input escaping or blocklisting is not an adequate primary defence.
  evaluator: security_analysis
  expected:
    criteria:
      - 'sql\s*injection'
      - 'cwe[- ]?89'
      - '(?:cursor\.execute\s*\([^)]*(?:%s|\?|:\w+)|execute\s*\(\s*["''][^"'']*(?:%s|\?)[^"'']*["'']\s*,)'
      - '(?:parameteri[sz]ed|prepared\s*statement|bind\s*(?:parameter|variable)|placeholder)'
      - '(?:exfiltrat|dump|read (?:any|all|arbitrary)|bypass\s+(?:the\s+)?authenticat|drop\s+table|delete|extract)'
    must_not:
      # Recommending escaping/sanitisation as the primary fix is the wrong answer.
      - '(?i)\bthe (?:best|primary|recommended|correct) (?:fix|defence|defense|solution) is to (?:escape|sanitiz|sanitis|blocklist|blacklist)'
      - '(?i)\bno (?:issues|vulnerabilities|problems)\b'
      - '(?i)\bthis code is secure\b'

- id: TD-04
  category: Terminal Debugging
  difficulty: easy
  description: "Floor division plus an unguarded empty input"
  prompt: |
    This helper is meant to return the arithmetic mean of a list of numbers as a float, or None when
    the list is empty. It does neither correctly. Fix it.

    ```python
    def average(nums):
        return sum(nums) // len(nums)
    ```

    Reply with ONLY the corrected function in a Python code block.
  evaluator: code_exec
  expected:
    - function: average
      args: [[1, 2]]
      expected: 1.5
    - function: average
      args: [[]]
      expected: null
    - function: average
      args: [[-1, -2]]
      expected: -1.5
    - function: average
      args: [[2, 2]]
      expected: 2
    - function: average
      args: [[1, 2, 4]]
      expected: 2.3333333333333335
      tolerance: 1.0e-9

- id: TD-05
  category: Terminal Debugging
  difficulty: medium
  description: "Mutating a dict while iterating it raises RuntimeError"
  prompt: |
    This function crashes intermittently in production with
    `RuntimeError: dictionary changed size during iteration`. Rewrite it so it returns a NEW dict
    containing only the sessions whose expiry is strictly greater than `now`, and never raises.

    ```python
    def remove_expired(sessions, now):
        for key, exp in sessions.items():
            if exp <= now:
                del sessions[key]
        return sessions
    ```

    Reply with ONLY the corrected function in a Python code block.
  evaluator: code_exec
  expected:
    - function: remove_expired
      args: [{"a": 1, "b": 5}, 3]
      expected: {"b": 5}
    - function: remove_expired
      args: [{}, 0]
      expected: {}
    - function: remove_expired
      args: [{"a": 3}, 3]
      expected: {}
    - function: remove_expired
      args: [{"a": 10, "b": 11, "c": 2}, 9]
      expected: {"a": 10, "b": 11}

- id: TD-06
  category: Terminal Debugging
  difficulty: hard
  description: "An O(n^2) implementation will hit the sandbox timeout on the last fixture"
  prompt: |
    Profiling shows this function dominates runtime for large n. Rewrite it to run in O(n) time (or
    better) while returning exactly the same values. It must complete for n = 200000 in well under a
    second.

    ```python
    def count_pairs_range(n, target):
        nums = list(range(n))
        count = 0
        for i in range(len(nums)):
            for j in range(i + 1, len(nums)):
                if nums[i] + nums[j] == target:
                    count += 1
        return count
    ```

    Reply with ONLY the optimised function in a Python code block.
  evaluator: code_exec
  expected:
    - function: count_pairs_range
      args: [10, 9]
      expected: 5
    - function: count_pairs_range
      args: [10, 0]
      expected: 0
    - function: count_pairs_range
      args: [5, 7]
      expected: 1
    - function: count_pairs_range
      args: [1, 0]
      expected: 0
    - function: count_pairs_range
      args: [200000, 199999]
      expected: 100000

- id: TD-07
  category: Terminal Debugging
  difficulty: hard
  description: "Late-binding closure capture in a comprehension"
  prompt: |
    Every function in the returned list behaves identically, which is not intended. Fix it.

    ```python
    def make_multipliers(n):
        return [lambda x: x * i for i in range(n)]

    def apply_multipliers(n, x):
        return [f(x) for f in make_multipliers(n)]
    ```

    `apply_multipliers(3, 10)` must return `[0, 10, 20]`.
    Reply with ONLY the corrected code in a Python code block.
  evaluator: code_exec
  expected:
    - function: apply_multipliers
      args: [3, 10]
      expected: [0, 10, 20]
    - function: apply_multipliers
      args: [1, 5]
      expected: [0]
    - function: apply_multipliers
      args: [0, 5]
      expected: []
    - function: apply_multipliers
      args: [4, 2]
      expected: [0, 2, 4, 6]

- id: TD-08
  category: Terminal Debugging
  difficulty: hard
  description: "Shallow copy aliases the inner rows, so the 'original' mutates too"
  prompt: |
    `set_cell_and_report` should return a two-element list: a NEW grid with one cell changed, and the
    original grid, unmodified. Because of a copying bug the second element changes too. Fix it.

    ```python
    def set_cell_and_report(grid, r, c, v):
        copy = [row for row in grid]
        copy[r][c] = v
        return [copy, grid]
    ```

    Reply with ONLY the corrected code in a Python code block.
  evaluator: code_exec
  expected:
    - function: set_cell_and_report
      args: [[[0, 0], [0, 0]], 0, 1, 9]
      expected: [[[0, 9], [0, 0]], [[0, 0], [0, 0]]]
    - function: set_cell_and_report
      args: [[[1]], 0, 0, 7]
      expected: [[[7]], [[1]]]
    - function: set_cell_and_report
      args: [[[1, 2], [3, 4]], 1, 0, 0]
      expected: [[[1, 2], [0, 4]], [[1, 2], [3, 4]]]

- id: TD-09
  category: Terminal Debugging
  difficulty: hard
  source: terminal-bench/debug-long-program
  description: "Diagnostic reasoning, graded on specific tooling rather than any mention of 'memory'"
  prompt: |
    A long-running Python service crashes with a segmentation fault. The crash is non-deterministic:
    it happens after anywhere from minutes to hours, never at the same point, and only in production
    where a C extension is loaded. Describe your debugging strategy, in this order:

    1. How to capture the faulting Python-level location despite the process dying without a traceback.
    2. How to get a native backtrace across the C boundary.
    3. How to make the crash reproducible.
    4. Which memory-error detector you would run and what it would show.
  evaluator: multi_step_solution
  expected:
    steps:
      - step: "Capture the Python-level fault location"
        pattern: 'faulthandler|PYTHONFAULTHANDLER'
        order: 1
      - step: "Native backtrace across the C boundary"
        pattern: '\bgdb\b|\blldb\b|core\s*dump|coredumpctl|py-bt'
        order: 2
      - step: "Make the crash reproducible"
        pattern: 'PYTHONHASHSEED|deterministic|stress|soak|record\s*(?:and|/)\s*replay|\brr\b|reduce the input|bisect'
        order: 3
      - step: "Memory-error detector"
        pattern: 'valgrind|AddressSanitizer|\basan\b|-fsanitize'
        order: 4
    must_not:
      # pdb cannot catch a segfault, and tracemalloc measures allocations, not
      # invalid access. Recommending either as the answer to (1) or (4) is wrong.
      - '(?i)\buse pdb to (?:catch|debug|find) the (?:segfault|segmentation fault|crash)\b'
      - '(?i)\btracemalloc\b[^.\n]{0,60}\b(?:find|locate|catch)[^.\n]{0,30}\bsegmentation fault\b'

- id: TD-10
  category: Terminal Debugging
  difficulty: hard
  source: terminal-bench/classifier-debug
  description: "Must name the metric that is invariant to prevalence, not just 'use F1'"
  prompt: |
    A binary classifier trained on a balanced dataset scored 95% accuracy in evaluation. Deployed on
    live traffic where only 10% of examples are positive, its accuracy is reported as 60%.

    1. Explain why accuracy is the wrong headline metric under class imbalance, and what accuracy a
       trivial majority-class predictor would achieve on the live distribution.
    2. Name the evaluation metric whose value does not change when only the class balance changes,
       and name one metric that does change with class balance.
    3. Give two concrete mitigations at training time and one at inference time.
  evaluator: multi_step_solution
  expected:
    steps:
      - step: "Majority-class baseline accuracy is 90%"
        pattern: '\b90\s*%|\b0\.9\b|ninety\s*percent'
        order: 1
      - step: "Prevalence-invariant metric named (ROC AUC / recall / specificity)"
        pattern: 'roc[- ]?auc|auroc|area under the roc|\brecall\b|\bsensitivity\b|\bspecificity\b'
        order: 2
      - step: "Prevalence-dependent metric named (precision / PR AUC / F1)"
        pattern: '\bprecision\b|pr[- ]?auc|average precision|\bf1\b'
        order: 3
      - step: "Training-time mitigation"
        pattern: 'class_weight|resampl|oversampl|undersampl|SMOTE|focal loss'
        order: 4
      - step: "Inference-time mitigation"
        pattern: 'threshold|decision boundary|recalibrat|calibrat|prior correction'
        order: 5
    must_not:
      - '(?i)\baccuracy is (?:the |a )?(?:good|appropriate|reliable|best) metric\b'
