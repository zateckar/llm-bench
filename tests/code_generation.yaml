# Code Generation Test Suite

- id: CG-01
  category: Code Generation
  prompt: "Write a Python function `fibonacci(n)` that returns the nth Fibonacci number (0-indexed: fibonacci(0)=0, fibonacci(1)=1). Reply with only the code in a Python code block."
  evaluator: code_exec
  expected:
    - function: fibonacci
      args: [0]
      expected: 0
    - function: fibonacci
      args: [1]
      expected: 1
    - function: fibonacci
      args: [5]
      expected: 5
    - function: fibonacci
      args: [10]
      expected: 55

- id: CG-02
  category: Code Generation
  prompt: "Write a Python function `reverse_string(s)` that reverses a string. Reply with only the code in a Python code block."
  evaluator: code_exec
  expected:
    - function: reverse_string
      args: ["hello"]
      expected: "olleh"
    - function: reverse_string
      args: ["abc"]
      expected: "cba"
    - function: reverse_string
      args: [""]
      expected: ""

- id: CG-03
  category: Code Generation
  prompt: "Write a Python function `is_palindrome(s)` that returns True if a string is a palindrome (case-insensitive), False otherwise. Reply with only the code in a Python code block."
  evaluator: code_exec
  expected:
    - function: is_palindrome
      args: ["racecar"]
      expected: true
    - function: is_palindrome
      args: ["hello"]
      expected: false
    - function: is_palindrome
      args: ["Madam"]
      expected: true

- id: CG-04
  category: Code Generation
  prompt: "Write a Python function `count_vowels(s)` that counts the number of vowels (a, e, i, o, u) in a string. Reply with only the code in a Python code block."
  evaluator: code_exec
  expected:
    - function: count_vowels
