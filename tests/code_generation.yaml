- id: CG-06
  category: Code Generation
  prompt: "Write a Python function `fizzbuzz(n)` that returns 'Fizz' if n is divisible by 3, 'Buzz' if divisible by 5, 'FizzBuzz' if divisible by both, and the number itself otherwise. Reply with only the code in a Python code block."
  evaluator: code_exec
  expected:
    - function: fizzbuzz
      args: [3]
      expected: "Fizz"
    - function: fizzbuzz
      args: [5]
      expected: "Buzz"
    - function: fizzbuzz
      args: [15]
      expected: "FizzBuzz"
    - function: fizzbuzz
      args: [7]
      expected: 7

- id: CG-07
  category: Code Generation
  prompt: "Write a Python function `flatten(lst)` that deeply flattens a nested list. Example: [1, [2, [3, 4], 5], 6] -> [1, 2, 3, 4, 5, 6]. Reply with only the code in a Python code block."
  evaluator: code_exec
  expected:
    - function: flatten
      args: [[1, [2, [3, 4], 5], 6]]
      expected: [1, 2, 3, 4, 5, 6]
    - function: flatten
      args: [[[1, 2], [3, [4, [5]]]]]
      expected: [1, 2, 3, 4, 5]
    - function: flatten
      args: [[]]
      expected: []

- id: CG-08
  category: Code Generation
  prompt: "Write a Python function `binary_search(arr, target)` that returns the index of target in sorted arr, or -1 if not found. Reply with only the code in a Python code block."
  evaluator: code_exec
  expected:
    - function: binary_search
      args: [[1, 3, 5, 7, 9], 5]
      expected: 2
    - function: binary_search
      args: [[1, 3, 5, 7, 9], 4]
      expected: -1
    - function: binary_search
      args: [[], 1]
      expected: -1

