- id: S6-reshape-01
  category: Instruction Following
  difficulty: expert
  source: 'Original stretch-v6; design inspiration: https://github.com/allenai/IFBench'
  description: Compositional task with an executable oracle; difficulty needs fresh calibration.
  prompt: "Apply EVERY stage in order to this five-row, six-column integer matrix: [[-6,4,-4,7,-6,-1],[-6,-4,6,6,-1,7],[6,-1,4,7,2,2],[4,-7,-1,-8,-9,-4],[8,0,8,7,-7,7]]\n\
    1. Rotate the entire matrix 90 degrees clockwise, producing six rows and five columns.\n2. Traverse\
    \ rotated rows from top to bottom; rows with even zero-based index left-to-right,\n   odd rows right-to-left.\
    \ This produces one flat sequence of 30 values.\n3. Using indices in that ORIGINAL flat sequence,\
    \ drop positions i where i modulo 4 is 1.\n   Also drop values divisible by 3. Do not renumber until\
    \ both filters are complete.\n4. Renumber survivors j from zero. Starting accumulator at zero, add\
    \ survivor when j is\n   even, subtract it when j is odd. After EACH operation emit accumulator modulo\
    \ 7 as a\n   number 0..6 (Euclidean remainder even for a negative accumulator).\n5. Run-length encode\
    \ consecutive equal emitted numbers as [number,count]. Do not merge\n   equal numbers separated by\
    \ other numbers. checksum is sum((j+1)*emitted[j]).\nReturn runs, kept (number of survivors), and\
    \ checksum. Output numbers, not strings.\nReturn only one JSON object with exactly the requested keys.\
    \ Arrays have the order specified above; do not add prose."
