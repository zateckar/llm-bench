# Challenge suite v2. Answer-key derivations: challenge_oracles.py.
# All parts must pass; no keyword-only credit. IDs intentionally differ from v1.

- id: MR2-01
  category: Mathematical Reasoning
  difficulty: expert
  source: challenge-v2
  description: Digit constraints jointly with modular arithmetic
  prompt: |
    Consider eight-digit base-4 numbers (digits 0,1,2,3), with no leading zero
    and no equal adjacent digits. Count those whose digit sum is 12, and among
    those count the numbers divisible by 7 (interpreting the number in base 4).
    Return JSON {"sum_12": ..., "also_divisible_by_7": ...} with integer counts.
  evaluator: json_match
  expected:
    value:
      sum_12: 1129
      also_divisible_by_7: 137
    mode: exact
  max_tokens: 8192
- id: MR2-02
  category: Mathematical Reasoning
  difficulty: expert
  source: challenge-v2
  description: Bounded compositions with parity and ordering restrictions
  prompt: |
    Put 17 indistinguishable tokens into five labeled boxes A,B,C,D,E.
    Each box holds at most 6. A holds at least 2, B holds an even number (zero
    allowed), C holds strictly fewer than D, and E holds at least 1.
    Count valid allocations and those valid allocations with E holding at least 4.
    Return JSON {"count": ..., "with_last_at_least_4": ...}.
  evaluator: json_match
  expected:
    value:
      count: 236
      with_last_at_least_4: 124
    mode: exact
  max_tokens: 8192
- id: MR2-03
  category: Mathematical Reasoning
  difficulty: expert
  source: challenge-v2
  description: Bayesian conditioning on a selective reporting process
  prompt: |
    Select urn A with probability 1/4, otherwise urn B. A has 4 red and 2 blue
    balls; B has 2 red and 5 blue. Draw three balls without replacement.
    An observer sends a report with probability 1 if exactly two draws are red,
    probability 1/3 if exactly one is red, and probability 0 otherwise.
    The report reveals nothing besides the fact that it was sent.
    Return JSON with report_probability, urn_A_given_report, two_red_given_report.
    Express every probability as [numerator,denominator] in lowest terms.
  evaluator: json_match
  expected:
    value:
      report_probability:
      - 5
      - 12
      urn_A_given_report:
      - 2
      - 5
      two_red_given_report:
      - 108
      - 175
    mode: exact
  max_tokens: 8192
- id: MR2-04
  category: Mathematical Reasoning
  difficulty: expert
  source: challenge-v2
  description: Coupled expected hitting times with self-loops
  prompt: |
    A Markov chain has transient states A,B,C and absorbing state Z.
    From A: B with probability 1/2, C with probability 1/2.
    From B: A, C, Z with probability 1/3 each.
    From C: A with probability 1/4, C with probability 1/2, Z with probability 1/4.
    Each transition, including a self-loop or entry to Z, costs one step.
    Return JSON with keys A,B,C giving the expected steps to first reach Z from
    each state, each as [numerator,denominator] in lowest terms.
  evaluator: json_match
  expected:
    value:
      A:
      - 17
      - 3
      B:
      - 9
      - 2
      C:
      - 29
      - 6
    mode: exact
  max_tokens: 8192
- id: MR2-05
  category: Mathematical Reasoning
  difficulty: expert
  source: challenge-v2
  description: Non-coprime congruences plus coprimality filtering
  prompt: |
    Let S contain integers n from 1 through 5000 satisfying n mod 12 = 5,
    n mod 18 = 11, and gcd(n,35)=1.
    Return JSON {"count": |S|, "sum": sum of S, "smallest": min S, "largest": max S}.
  evaluator: json_match
  expected:
    value:
      count: 96
      sum: 240240
      smallest: 29
      largest: 4997
    mode: exact
  max_tokens: 8192
- id: MR2-06
  category: Mathematical Reasoning
  difficulty: expert
  source: challenge-v2
  description: Derangements with adjacency, relative order, and parity
  prompt: |
    Permute the numbers 1 through 7. No number may equal its one-based position;
    1 and 2 must not be adjacent; and 3 must occur before 4.
    Count all such permutations and how many of them are even (have an even number
    of inversions). Return JSON {"count": ..., "even_permutations": ...}.
  evaluator: json_match
  expected:
    value:
      count: 608
      even_permutations: 308
    mode: exact
  max_tokens: 8192
- id: MR2-07
  category: Mathematical Reasoning
  difficulty: expert
  source: challenge-v2
  description: Conditional dice probability with multiplicities
  prompt: |
    Roll four independent fair six-sided dice. Event E means their sum is at
    least 17 AND exactly three distinct face values appear. Let F mean at least
    one die shows 6. Compute P(E) and P(F|E).
    Return JSON {"event_probability": [numerator,denominator],
    "six_given_event": [numerator,denominator]}, with fractions in lowest terms.
  evaluator: json_match
  expected:
    value:
      event_probability:
      - 4
      - 27
      six_given_event:
      - 15
      - 16
    mode: exact
  max_tokens: 8192
- id: MR2-08
  category: Mathematical Reasoning
  difficulty: expert
  source: challenge-v2
  description: Lattice-path counting with a corridor, obstacles, and waypoint
  prompt: |
    Paths on the integer grid go from (0,0) to (7,6) using only steps (1,0) and (0,1).
    A path must never visit (2,2), (3,4), or (5,3), must visit (4,2), and must satisfy
    y <= x+1 at every visited point, including endpoints.
    Return JSON {"paths": number of valid paths}.
  evaluator: json_match
  expected:
    value:
      paths: 126
    mode: exact
  max_tokens: 8192
- id: MR2-09
  category: Mathematical Reasoning
  difficulty: expert
  source: challenge-v2
  description: Integer quadratic optimization with coupled constraints
  prompt: |
    Integers x,y,z each lie between 0 and 12 inclusive and obey
    2*x+3*y+z=24 and x+y+z>=10.
    Minimize 3*x^2+2*y^2+z^2-2*x*y-4*y*z.
    Return JSON {"minimum": ..., "minimizers": [[x,y,z], ...]} containing EVERY
    minimizing triple in lexicographic order.
  evaluator: json_match
  expected:
    value:
      minimum: -49
      minimizers:
      - - 0
        - 5
        - 9
    mode: exact
  max_tokens: 8192
- id: MR2-10
  category: Mathematical Reasoning
  difficulty: expert
  source: challenge-v2
  description: Symmetry counting with periodic configurations
  prompt: |
    Color the nine positions of a circle with A,B,C, using each color exactly
    three times. Adjacent positions, including position 9 next to 1, must have
    different colors. Colors are named: exchanging A and B is not an equivalence.
    Count configurations (1) on labeled positions 1..9, (2) identifying rotations
    only, (3) identifying both rotations and reflections. Do not assume all
    configurations have nine distinct rotations.
    Return JSON {"labeled": ..., "up_to_rotation": ...,
    "up_to_rotation_and_reflection": ...}.
  evaluator: json_match
  expected:
    value:
      labeled: 132
      up_to_rotation: 16
      up_to_rotation_and_reflection: 8
    mode: exact
  max_tokens: 8192
- id: MR2-11
  category: Mathematical Reasoning
  difficulty: expert
  source: challenge-v2
  description: Non-uniform coupon collection from two initial states
  prompt: |
    Independent draws produce types 1,2,3,4 with probabilities 1/10,2/10,3/10,4/10.
    Compute expected additional draws to collect all types (a) starting empty,
    (b) starting with types 1 and 4 already collected.
    Return JSON {"from_empty": [numerator,denominator],
    "after_types_1_and_4": [numerator,denominator]}, fractions in lowest terms.
  evaluator: json_match
  expected:
    value:
      from_empty:
      - 445
      - 36
      after_types_1_and_4:
      - 19
      - 3
    mode: exact
  max_tokens: 8192
- id: MR2-12
  category: Mathematical Reasoning
  difficulty: expert
  source: challenge-v2
  description: Factorial valuations with multiple limiting primes
  prompt: |
    Let B = 2^7 * 3^4 * 5^2. Find the smallest positive integer n for which B^8 divides n!.
    Return JSON {"n": ..., "valuations": [v2(n!),v3(n!),v5(n!)],
    "previous_max_power": largest integer k such that B^k divides (n-1)!}.
    vp(m) is the exponent of prime p in m.
  evaluator: json_match
  expected:
    value:
      n: 70
      valuations:
      - 67
      - 32
      - 16
      previous_max_power: 7
    mode: exact
  max_tokens: 8192
