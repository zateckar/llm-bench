# Challenge suite v2. Answer-key derivations: challenge_oracles.py.
# All parts must pass; no keyword-only credit. IDs intentionally differ from v1.

- id: AU2-01
  category: Agentic Use Cases
  difficulty: expert
  source: challenge-v2
  description: Find a safe minimal rolling deployment under two resource constraints
  prompt: |
    A service starts with 4 old ready instances and 0 new. The target is 0 old
    and exactly 4 new. Old instances consume 2 resource units each, new ones 3.
    Every state must have at least 3 ready instances and use at most 12 resource
    units. An action either adds 1 or 2 new instances, or removes 1 or 2 old
    instances. Added instances become ready atomically; each action costs one step.
    You cannot add old instances or remove new ones. Never exceed 4 new instances.
    Find the shortest valid plan. Break ties lexicographically over the sequence
    of [action,count] pairs, with add < remove and 1 < 2.
    Return JSON {"steps": ..., "plan": [["add" or "remove", count], ...]}.
  evaluator: json_match
  expected:
    value:
      steps: 6
      plan:
      - - remove
        - 1
      - - add
        - 2
      - - remove
        - 2
      - - add
        - 1
      - - remove
        - 1
      - - add
        - 1
    mode: exact
  max_tokens: 8192
- id: AU2-02
  category: Agentic Use Cases
  difficulty: expert
  source: challenge-v2
  description: Circuit-breaker replay with half-open probes and exact cooldown boundaries
  prompt: |
    A breaker starts closed with zero consecutive failures. In closed state, a
    success resets that counter; three consecutive admitted failures open it for
    5 seconds. Requests at times strictly before the open-until time are skipped
    and have no effect. At or after that time the first request is a half-open
    probe: success closes/reset; failure reopens for 5 seconds from probe time.
    Requests and their outcomes IF admitted (time, S=success/F=failure):
    (0,F),(1,F),(2,S),(3,F),(4,F),(5,F),(7,S),(10,F),(11,S),
    (15,S),(16,F),(17,F),(18,S). Outcomes are instantaneous.
    Return JSON with admitted and skipped (arrays of times), state after the last
    request (closed/open), and consecutive_failures after the last request.
  evaluator: json_match
  expected:
    value:
      admitted:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 10
      - 15
      - 16
      - 17
      - 18
      skipped:
      - 7
      - 11
      state: closed
      consecutive_failures: 0
    mode: exact
  max_tokens: 8192
- id: AU2-03
  category: Agentic Use Cases
  difficulty: expert
  source: challenge-v2
  description: CDC replay with snapshot boundary, aborts, duplicate delivery, and pending transactions
  prompt: |
    A target snapshot at LSN 100 has rows {a:10,b:20}. Replay this arrival-ordered
    change stream; each tuple is (LSN,transaction,operation,key,value):
    (99,x,set,a,9),(101,p,set,a,11),(102,q,delete,b,null),(103,p,set,c,30),
    (104,q,abort,null,null),(105,p,commit,null,null),(105,p,commit,null,null),
    (106,r,set,a,12),(107,s,set,b,25),(108,s,commit,null,null),(109,r,set,c,31).
    Ignore LSN<=100 and duplicate LSNs. Buffer writes by transaction, applying
    them in stream order only on commit; abort discards them. Uncommitted writes
    remain invisible. This exercise permits cutover only when no transaction is pending.
    Return JSON with rows (final visible object), committed (transaction IDs in
    commit order), pending (sorted IDs), and safe_to_cut_over (boolean).
  evaluator: json_match
  expected:
    value:
      rows:
        a: 11
        b: 25
        c: 30
      committed:
      - p
      - s
      pending:
      - r
      safe_to_cut_over: false
    mode: exact
  max_tokens: 8192
- id: AU2-04
  category: Agentic Use Cases
  difficulty: expert
  source: challenge-v2
  description: Capacity optimization with CPU, RAM, inventory, and instance-count constraints
  prompt: |
    Choose integer counts of instance types A,B,C. Their (CPU,RAM,daily cost) are
    A=(3,2,8), B=(5,4,13), C=(9,5,21). Availability: A<=8, B<=6, C<=4.
    Need CPU>=32, RAM>=21, at most 8 total instances, and at least 2 instances of
    types B or C combined. Minimize daily cost; break ties by fewest instances,
    then lexicographically smallest [A,B,C] count vector.
    Return JSON with cost, instances, allocation ([A,B,C]), cpu, and ram.
  evaluator: json_match
  expected:
    value:
      cost: 81
      instances: 5
      allocation:
      - 0
      - 3
      - 2
      cpu: 33
      ram: 22
    mode: exact
  max_tokens: 8192
- id: AU2-05
  category: Agentic Use Cases
  difficulty: hard
  source: challenge-v2
  description: Saga compensation from observed effects rather than attempted calls
  prompt: |
    Order o-31 must now be cancelled. Completed evidence: reservation r-81 is active;
    charge ch-19 for 7200 cents succeeded; the local charge call timed out, but a
    later lookup confirmed success. Shipment creation failed with a documented
    no-effect error and returned no shipment ID. No compensation has run.
    Policy: cancel active reservations first; refund successful charges second;
    mark the order cancelled last. Do not compensate operations that had no effect.
    Tools and exact parameters:
      cancel_reservation(reservation_id)
      refund(charge_id, amount, key) -- key must be "refund:" followed by order ID
      cancel_shipment(shipment_id)
      charge(order_id, amount, key)
      mark_order(order_id, state)
    Assume all recovery calls succeed. Return JSON {"calls": [{"tool": name,
    "args": object}, ...], "net_charged": final charged cents minus refunded cents}.
  evaluator: json_match
  expected:
    value:
      calls:
      - tool: cancel_reservation
        args:
          reservation_id: r-81
      - tool: refund
        args:
          charge_id: ch-19
          amount: 7200
          key: refund:o-31
      - tool: mark_order
        args:
          order_id: o-31
          state: cancelled
      net_charged: 0
    mode: exact
- id: AU2-06
  category: Agentic Use Cases
  difficulty: expert
  source: challenge-v2
  description: Retry scheduling with worker contention and dead-letter limits
  prompt: |
    A single worker runs one job at a time; each attempt takes exactly 1 second.
    Initial jobs (ready_at,id): (0,A),(0,B),(2,C). Whenever idle, pick the pending
    job with smallest (ready_at,id), waiting until ready_at if needed. After failed
    attempt k, retry becomes ready at finish_time + 2^k. Maximum 3 attempts; a
    failure on attempt 3 dead-letters the job immediately. A fails twice then succeeds;
    B fails all attempts; C succeeds first time. Attempts begin at 1.
    Return JSON {"starts": [[start_time,id,attempt], ...] in execution order,
    "dead_letters": IDs in dead-letter order, "finished_at": final completion time}.
  evaluator: json_match
  expected:
    value:
      starts:
      - - 0
        - A
        - 1
      - - 1
        - B
        - 1
      - - 2
        - C
        - 1
      - - 3
        - A
        - 2
      - - 4
        - B
        - 2
      - - 8
        - A
        - 3
      - - 9
        - B
        - 3
      dead_letters:
      - B
      finished_at: 10
    mode: exact
  max_tokens: 8192
- id: AU2-07
  category: Agentic Use Cases
  difficulty: expert
  source: challenge-v2
  description: Snapshot write skew versus a serial execution
  prompt: |
    State initially is {a:1,b:1,c:1}; at least one value must remain 1.
    T1, T2, T3 all take this same initial snapshot. Each sums a,b,c; if the sum is
    >=2, it writes 0 to its own key (T1->a, T2->b, T3->c), otherwise writes nothing.
    They commit in T1,T2,T3 order. Under this exercise's snapshot isolation, a
    transaction aborts only if a key it writes changed since its snapshot.
    Separately, execute T1,T2,T3 serially, each reading the latest committed state.
    Return JSON with snapshot_commits (IDs in order), snapshot_final, serial_final,
    and violates_at_least_one (whether the snapshot execution breaks the invariant).
  evaluator: json_match
  expected:
    value:
      snapshot_commits:
      - T1
      - T2
      - T3
      snapshot_final:
        a: 0
        b: 0
        c: 0
      serial_final:
        a: 0
        b: 0
        c: 1
      violates_at_least_one: true
    mode: exact
  max_tokens: 8192
- id: AU2-08
  category: Agentic Use Cases
  difficulty: hard
  source: challenge-v2
  description: Replica resolution with equal-version conflicts and tombstones
  prompt: |
    Replicas contain key -> (version,value):
    A: x=(4,red), y=(7,up). B: x=(5,blue), y=(6,down).
    C: x=(5,green), y=(7,up). D: x=(3,red), y=(8,null).
    Each read uses only its named responders, independently, with no repair.
    Pick the highest version returned. If distinct values tie at that version,
    return {status:"conflict",version:N} with NO value field. Otherwise return
    {status:"ok",version:N,value:V}, or status:"deleted" for a null tombstone.
    Resolve reads in order: x from A+B, x from B+C, y from A+C, y from B+D.
    Return JSON {"reads": [four result objects]}.
  evaluator: json_match
  expected:
    value:
      reads:
      - status: ok
        version: 5
        value: blue
      - status: conflict
        version: 5
      - status: ok
        version: 7
        value: up
      - status: deleted
        version: 8
        value: null
    mode: exact
