- id: AC-09
  category: Advanced Coding
  difficulty: hard
  description: "Sliding-window rate limiter with per-key state and injected time"
  prompt: |
    Implement a class `RateLimiter` enforcing a sliding-window limit per key:
      - `__init__(self, max_requests: int, window_seconds: int)`
      - `allow(self, key: str, now: float) -> bool`
    `allow` returns True and records the request if fewer than `max_requests` requests for that key fall within the window ending at `now` (a request at time t counts while now - t < window_seconds); otherwise it returns False and records nothing. Each key has an independent budget. Time is supplied by the caller, never read from the clock.
    Reply with ONLY the Python code in a code block.
  evaluator: code_exec
  expected:
    - function: test_rate_limiter
      args: []
      expected: true

- id: AC-10
  category: Advanced Coding
  difficulty: expert
  description: "Time-travel reads, including writes that arrive out of order"
  prompt: |
    Implement a class `VersionedStore` supporting point-in-time reads:
      - `set(self, key: str, value, timestamp: int) -> None`
      - `get(self, key: str, timestamp: int)` returns the value written at the greatest timestamp less than or equal to `timestamp`, or None if the key had no value at that time.
    Writes may arrive with timestamps out of order and must still be read back in timestamp order. `get` should be O(log n) in the number of writes for a key.
    Reply with ONLY the Python code in a code block.
  evaluator: code_exec
  expected:
    - function: test_versioned_store
      args: []
      expected: true

- id: AC-11
  category: Advanced Coding
  difficulty: hard
  description: "Deterministic tie-breaking plus cycle detection"
  prompt: |
    Write a Python function `topological_sort(graph)` where `graph` maps each node to a list of nodes it must precede. Return a list of all nodes in a valid topological order, breaking ties by choosing the lexicographically smallest available node. Return an empty list if the graph contains a cycle.
    Reply with ONLY the Python code in a code block.
  evaluator: code_exec
  expected:
    - function: topological_sort
      args: [{"a": ["b", "c"], "b": ["d"], "c": ["d"], "d": []}]
      expected: ["a", "b", "c", "d"]
    - function: topological_sort
      args: [{"a": ["b"], "b": ["a"]}]
      expected: []
    - function: topological_sort
      args: [{}]
      expected: []
    - function: topological_sort
      args: [{"z": [], "a": [], "m": []}]
      expected: ["a", "m", "z"]
    - function: topological_sort
      args: [{"b": ["a"], "a": []}]
      expected: ["b", "a"]

