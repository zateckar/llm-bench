# Advanced Coding Test Suite
#
# The class-based problems are graded by harnesses in evaluators.TEST_HELPERS.
# Those harnesses were rewritten to assert the properties that actually define
# the data structure - LRU recency on both get and overwrite, trie prefixes that
# are not words, BST ancestor bounds rather than parent-only comparisons - and to
# report which assertion failed instead of swallowing the exception.

- id: AC-01
  category: Advanced Coding
  difficulty: medium
  prompt: |
    Write a Python function `merge_intervals(intervals: list[list[int]]) -> list[list[int]]` that merges overlapping intervals. Each interval is a two-element list [start, end]. Input is not necessarily sorted. Touching intervals merge: [[1,2],[2,3]] -> [[1,3]]. Return each merged interval as a two-element list, sorted by start. Handle empty input. Time complexity must be O(n log n).
    Reply with ONLY the Python code in a code block.
  evaluator: code_exec
  expected:
    - function: merge_intervals
      args: [[[1, 3], [2, 6], [8, 10], [15, 18]]]
      expected: [[1, 6], [8, 10], [15, 18]]
    - function: merge_intervals
      args: [[]]
      expected: []
    - function: merge_intervals
      args: [[[1, 4], [4, 5]]]
      expected: [[1, 5]]
    - function: merge_intervals
      args: [[[5, 6], [1, 3], [2, 4]]]
      expected: [[1, 4], [5, 6]]
    - function: merge_intervals
      args: [[[1, 10], [2, 3], [4, 5]]]
      expected: [[1, 10]]
    - function: merge_intervals
      args: [[[1, 2]]]
      expected: [[1, 2]]

- id: AC-02
  category: Advanced Coding
