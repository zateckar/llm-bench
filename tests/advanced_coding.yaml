# Advanced Coding Test Suite

- id: AC-01
  category: Advanced Coding
  prompt: |
    Write a Python function `merge_intervals(intervals: list[list[int]]) -> list[list[int]]` that merges overlapping intervals. Each interval is a two-element list [start, end]. Example: [[1,3],[2,6],[8,10],[15,18]] -> [[1,6],[8,10],[15,18]]

    Requirements:
    - Handle empty input
    - Handle single interval
    - Handle fully overlapping intervals
    - Handle touching intervals [[1,2],[2,3]] -> [[1,3]]
    - O(n log n) time complexity
    - Return each merged interval as a two-element list.

    Reply with ONLY the Python code in a code block.
  evaluator: code_exec
  expected:
    - function: merge_intervals
      args: [[[1, 3], [2, 6], [8, 10], [15, 18]]]
      expected: [[1, 6], [8, 10], [15, 18]]
    - function: merge_intervals
      args: [[]]
      expected: []
    - function: merge_intervals
      args: [[[1, 4], [4, 5]]]
      expected: [[1, 5]]

