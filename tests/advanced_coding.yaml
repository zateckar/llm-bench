    args: [[], 0]
    expected: [-1, -1]
    relative: 0
    tolerance: 0
  - function: shortest_subarray
    args: [[-5, -2, -3], -2]
    expected: [1, 2]
    relative: 0
    tolerance: 0
  - function: shortest_subarray
    args: [[-5, -4], -3]
    expected: [-1, -1]
    relative: 0
    tolerance: 0
  - function: shortest_subarray
    args: [[1, 2, 1, 2], 3]
    expected: [0, 2]
    relative: 0
    tolerance: 0
  - function: shortest_subarray
    args: [[84, -37, 32, 40, 95], 167]
    expected: [2, 5]
    relative: 0
    tolerance: 0
  - function: shortest_subarray
