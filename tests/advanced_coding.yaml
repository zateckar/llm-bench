- id: AC-05
  category: Advanced Coding
  prompt: |
    Optimize this function for time complexity:

    ```python
    def two_sum(nums: list[int], target: int) -> list[int]:
        for i in range(len(nums)):
            for j in range(i + 1, len(nums)):
                if nums[i] + nums[j] == target:
                    return [i, j]
        return [-1, -1]
    ```

    Current: O(n²). Rewrite to O(n), keeping the same return type (a list of two indices). Reply with ONLY the Python code in a code block.
  evaluator: code_exec
  expected:
    - function: two_sum
      args: [[2, 7, 11, 15], 9]
      expected: [0, 1]
    - function: two_sum
      args: [[3, 2, 4], 6]
      expected: [1, 2]

