- id: AC-03
  category: Advanced Coding
  difficulty: medium
  description: "The even/odd branches are swapped; a correct fix must not mutate the caller's list"
  prompt: |
    This function is wrong. Identify the bug and reply with the corrected function.

    ```python
    def find_median(nums: list[int]) -> float:
        nums.sort()
        n = len(nums)
        if n % 2 == 0:
            return nums[n // 2]
        else:
            return (nums[n // 2 - 1] + nums[n // 2]) / 2
    ```

    The corrected function must also leave the caller's list unmodified.
    Reply with ONLY the corrected Python code in a code block.
  evaluator: code_exec
  expected:
    - function: find_median
      args: [[1, 2, 3]]
      expected: 2
    - function: find_median
      args: [[1, 2, 3, 4]]
      expected: 2.5
    - function: find_median
      args: [[3, 1, 2]]
      expected: 2
    - function: find_median
      args: [[5]]
      expected: 5
    - function: find_median
      args: [[4, 1, 3, 2]]
      expected: 2.5

- id: AC-04
  category: Advanced Coding
  difficulty: hard
  description: "Round-trip over skewed trees, negatives, zero, and duplicate values"
  prompt: |
    Write `serialize_tree(root) -> str` and `deserialize_tree(data: str)` for a binary tree, plus the TreeNode class:

        class TreeNode:
            def __init__(self, val=0, left=None, right=None):
                self.val = val
                self.left = left
                self.right = right

    `deserialize_tree(serialize_tree(t))` must reproduce a structurally identical tree for any tree, including the empty tree, left-skewed chains, negative values and duplicate values. `serialize_tree` must return a string.
    Reply with ONLY the Python code in a code block.
  evaluator: code_exec
  expected:
    - function: test_serialize
      args: []
      expected: true

- id: AC-05
  category: Advanced Coding
  difficulty: medium
  prompt: |
    Rewrite this O(n^2) function to run in O(n), keeping the same signature and return type (a list of two indices, ascending, or [-1, -1] when no pair sums to the target).

    ```python
    def two_sum(nums: list[int], target: int) -> list[int]:
        for i in range(len(nums)):
            for j in range(i + 1, len(nums)):
                if nums[i] + nums[j] == target:
                    return [i, j]
        return [-1, -1]
    ```

    Reply with ONLY the Python code in a code block.
  evaluator: code_exec
  expected:
    - function: two_sum
      args: [[2, 7, 11, 15], 9]
      expected: [0, 1]
    - function: two_sum
      args: [[3, 2, 4], 6]
      expected: [1, 2]
    - function: two_sum
      args: [[3, 3], 6]
      expected: [0, 1]
    - function: two_sum
      args: [[1, 2, 3], 7]
      expected: [-1, -1]
    - function: two_sum
      args: [[0, 4, 3, 0], 0]
      expected: [0, 3]
    - function: two_sum
      args: [[-3, 4, 3, 90], 0]
      expected: [0, 2]

- id: AC-06
  category: Advanced Coding
  difficulty: hard
  description: "Duplicate characters in t must be counted, not just present"
  prompt: |
    Write a Python function `min_window(s: str, t: str) -> str` returning the shortest substring of s containing every character of t including duplicates. Return the empty string when no such window exists. If several windows tie in length, return the leftmost.
    Example: s='ADOBECODEBANC', t='ABC' -> 'BANC'
    Reply with ONLY the Python code in a code block.
  evaluator: code_exec
  expected:
    - function: min_window
      args: ["ADOBECODEBANC", "ABC"]
      expected: "BANC"
    - function: min_window
      args: ["a", "a"]
      expected: "a"
    - function: min_window
      args: ["a", "aa"]
      expected: ""
    - function: min_window
      args: ["aa", "aa"]
      expected: "aa"
    - function: min_window
      args: ["", "a"]
      expected: ""
    - function: min_window
      args: ["bba", "ab"]
      expected: "ba"

- id: AC-07
  category: Advanced Coding
  difficulty: hard
  prompt: |
    Write a Python function `dijkstra(graph, start, end)` returning the shortest total weight from start to end, or -1 when end is unreachable. `graph` is a dict mapping each node to a list of (neighbour, weight) pairs; all weights are non-negative. The distance from a node to itself is 0.
    Reply with ONLY the Python code in a code block.
  evaluator: code_exec
  expected:
    - function: dijkstra
      args: [{"A": [["B", 1], ["C", 4]], "B": [["C", 2], ["D", 5]], "C": [["D", 1]], "D": []}, "A", "D"]
      expected: 4
    - function: dijkstra
      args: [{"A": [["B", 1]], "B": []}, "A", "C"]
      expected: -1
    - function: dijkstra
      args: [{"A": [["B", 1]], "B": []}, "A", "A"]
      expected: 0
    - function: dijkstra
      args: [{"A": [["B", 10], ["C", 1]], "B": [], "C": [["B", 1]]}, "A", "B"]
      expected: 2
    - function: dijkstra
      args: [{"A": [], "B": []}, "A", "B"]
      expected: -1

