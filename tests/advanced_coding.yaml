- id: AC2-06
  category: Advanced Coding
  difficulty: expert
  source: challenge-v2
  description: Weighted scheduling with reconstruction and lexicographic ties
  prompt: |
    Implement optimal_jobs(jobs). Each job is [id,start,end,profit], with a unique
        string id, integer times start<end, and integer profit (possibly negative).
        Select non-overlapping half-open jobs maximizing total profit. Touching jobs
        are compatible. Selecting nothing is allowed. Break equal-profit ties by the
        lexicographically smallest SORTED list of selected IDs (Python list comparison,
        including the shorter-prefix rule). Return {"profit": integer, "ids": sorted list}.
        Jobs arrive unsorted. Support up to 16 jobs; avoid assumptions about positive profits.

    Return only Python code defining the function. Standard library only.
  evaluator: code_exec
  expected:
  - function: optimal_jobs
    args: [[]]
    expected: {profit: 0, ids: []}
    relative: 0
    tolerance: 0
  - function: optimal_jobs
    args: [[[a, 0, 3, 5], [b, 0, 1, 3], [c, 1, 3, 3]]]
    expected: {profit: 6, ids: [b, c]}
    relative: 0
    tolerance: 0
  - function: optimal_jobs
    args: [[[z, 0, 2, 5], [a, 0, 1, 2], [b, 1, 2, 3]]]
    expected: {profit: 5, ids: [a, b]}
    relative: 0
    tolerance: 0
  - function: optimal_jobs
    args: [[[a, 0, 1, 0], [b, 1, 2, 2]]]
    expected: {profit: 2, ids: [a, b]}
    relative: 0
    tolerance: 0
  - function: optimal_jobs
    args: [[[b, 0, 1, 2], [z, 1, 2, 0]]]
    expected: {profit: 2, ids: [b]}
    relative: 0
    tolerance: 0
  - function: optimal_jobs
    args: [[[a, 0, 1, -1], [b, 1, 2, -2]]]
    expected: {profit: 0, ids: []}
    relative: 0
    tolerance: 0
  - function: optimal_jobs
    args: [[[c, 3, 5, 6], [b, 1, 4, 9], [a, -1, 1, 3], [d, 1, 3, 4]]]
    expected: {profit: 13, ids: [a, c, d]}
    relative: 0
    tolerance: 0
  - function: optimal_jobs
    args: [[[a, 0, 2, 0], [b, 2, 3, 0]]]
    expected: {profit: 0, ids: []}
    relative: 0
    tolerance: 0
  max_tokens: 4096
- id: AC2-07
  category: Advanced Coding
  difficulty: expert
  source: challenge-v2
  description: Idempotent ledger replay including failed IDs and zero balances
  prompt: |
    Implement reconcile(events). Process [id,source,destination,amount] in input
        order, starting with empty balances. IDs/accounts are strings; amount is an
        integer. BANK has unlimited funds and is never included in balances. Other
        accounts start at zero. Reject amount<=0, source==destination, or insufficient
        source balance. Rejection changes no balances. Each ID is consumed on its FIRST
        occurrence, even if rejected; silently ignore all later occurrences of it,
        even if their payload differs. Return {"balances": object, "rejected": IDs in
        rejection order}. Include only non-BANK accounts touched by successful events;
        retain accounts whose balance becomes zero. Support 2000 events.

    Return only Python code defining the function. Standard library only.
  evaluator: code_exec
  expected:
  - function: reconcile
    args: [[]]
    expected: {balances: {}, rejected: []}
    relative: 0
    tolerance: 0
  - function: reconcile
    args: [[['1', BANK, a, 10], ['2', a, b, 7], ['3', b, BANK, 7]]]
    expected: {balances: {a: 3, b: 0}, rejected: []}
    relative: 0
    tolerance: 0
  - function: reconcile
    args: [[[x, a, b, 5], [fund, BANK, a, 9], [x, a, b, 5]]]
    expected: {balances: {a: 9}, rejected: [x]}
    relative: 0
    tolerance: 0
  - function: reconcile
    args: [[[a, BANK, x, 4], [a, BANK, x, 99], [b, x, y, 5]]]
    expected: {balances: {x: 4}, rejected: [b]}
    relative: 0
    tolerance: 0
  - function: reconcile
    args: [[[a, BANK, BANK, 2], [b, BANK, x, 0], [c, BANK, x, -3]]]
    expected: {balances: {}, rejected: [a, b, c]}
    relative: 0
    tolerance: 0
  - function: reconcile
    args: [[['1', BANK, a, 5], ['2', a, a, 2], ['3', a, BANK, 5]]]
    expected: {balances: {a: 0}, rejected: ['2']}
    relative: 0
    tolerance: 0
  - function: reconcile
    args: [[['1', BANK, a, 1], ['2', a, b, 1], ['3', b, a, 1], ['4', a, c, 2]]]
    expected: {balances: {a: 1, b: 0}, rejected: ['4']}
    relative: 0
    tolerance: 0
  max_tokens: 4096
- id: AC2-08
  category: Advanced Coding
  difficulty: expert
  source: challenge-v2
  description: Wildcard matching with escaped metacharacters and full-string semantics
  prompt: |
    Implement glob_match(pattern, text) -> bool for full-string, case-sensitive
        matching. Unescaped ? matches exactly one character; unescaped * matches any
        sequence including empty. Backslash escapes the very next character, whatever
        it is (so \q matches q); a trailing unmatched backslash makes the pattern
        invalid and returns False. An escaped * or ? is literal. A backslash can itself
        be escaped. Wildcards can match newlines. Inputs have length <=100; do not use
        filesystem globbing. Empty pattern matches only empty text.

    Return only Python code defining the function. Standard library only.
  evaluator: code_exec
  expected:
  - function: glob_match
    args: ['', '']
    expected: true
    relative: 0
    tolerance: 0
  - function: glob_match
    args: ['', a]
    expected: false
    relative: 0
    tolerance: 0
  - function: glob_match
    args: ['*', "a\nb"]
    expected: true
    relative: 0
    tolerance: 0
  - function: glob_match
    args: ['a?b', "a\nb"]
    expected: true
    relative: 0
    tolerance: 0
  - function: glob_match
    args: [a*b, ab]
    expected: true
    relative: 0
    tolerance: 0
  - function: glob_match
    args: [a\*b, a*b]
    expected: true
    relative: 0
    tolerance: 0
  - function: glob_match
    args: [a\*b, axxb]
    expected: false
    relative: 0
    tolerance: 0
  - function: glob_match
    args: ['\?*', '?abc']
    expected: true
    relative: 0
    tolerance: 0
  - function: glob_match
    args: [abc\, abc]
    expected: false
    relative: 0
    tolerance: 0
  - function: glob_match
    args: [\\, \]
    expected: true
    relative: 0
    tolerance: 0
  - function: glob_match
    args: [\q, q]
    expected: true
    relative: 0
    tolerance: 0
  - function: glob_match
    args: ['a**?b', acb]
    expected: true
    relative: 0
    tolerance: 0
  - function: glob_match
    args: [a*b, abx]
    expected: false
    relative: 0
    tolerance: 0
  - function: glob_match
    args: ['?', '']
    expected: false
    relative: 0
    tolerance: 0
  - function: glob_match
    args: ['*?*?', a]
    expected: false
    relative: 0
    tolerance: 0
  max_tokens: 4096
