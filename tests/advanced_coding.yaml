- id: AC-03
  category: Advanced Coding
  prompt: |
    This code has a bug. Find and fix it:

    ```python
    def find_median(nums: list[int]) -> float:
        nums.sort()
        n = len(nums)
        if n % 2 == 0:
            return nums[n // 2]
        else:
            return (nums[n // 2 - 1] + nums[n // 2]) / 2
    ```

    What is the bug? Reply with the corrected function.
  evaluator: code_exec
  expected:
    - function: find_median
      args: [[1, 2, 3]]
      expected: 2.0
    - function: find_median
      args: [[1, 2, 3, 4]]
      expected: 2.5

