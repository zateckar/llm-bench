# Challenge suite v2. Answer-key derivations: challenge_oracles.py.
# All parts must pass; no keyword-only credit. IDs intentionally differ from v1.

- id: AC2-01
  category: Advanced Coding
  difficulty: expert
  source: challenge-v2
  description: Earliest arrival in a time-window graph; waiting and departure boundaries
  prompt: |
    Implement temporal_route(n, edges, start, end, departure). Nodes are integers
        0..n-1. Each directed edge is [u,v,duration,open,close]. You may depart on it
        at any time t with open <= t < close, and arrive at t+duration (arrival may be
        after close). Waiting at nodes is allowed. All inputs are nonnegative integers,
        durations are positive, and open < close. Parallel edges and cycles may occur.
        Return earliest arrival time at end starting at start at departure, or None if
        unreachable. If start=end return departure. Support n<=100 and <=500 edges.

    Return only Python code defining the function. Standard library only.
  evaluator: code_exec
  expected:
  - function: temporal_route
    args: [4, [[0, 1, 3, 0, 4], [1, 3, 2, 6, 8], [0, 2, 1, 0, 5], [2, 3, 10, 0, 10]], 0, 3, 0]
    expected: 8
    relative: 0
    tolerance: 0
  - function: temporal_route
    args: [2, [[0, 1, 8, 2, 3]], 0, 1, 2]
    expected: 10
    relative: 0
    tolerance: 0
  - function: temporal_route
    args: [2, [[0, 1, 8, 2, 3]], 0, 1, 3]
    expected: null
    relative: 0
    tolerance: 0
  - function: temporal_route
    args: [3, [[0, 1, 2, 0, 3], [1, 2, 1, 0, 2]], 0, 2, 0]
    expected: null
    relative: 0
    tolerance: 0
  - function: temporal_route
    args: [1, [], 0, 0, 7]
    expected: 7
    relative: 0
    tolerance: 0
  - function: temporal_route
    args: [3, [[0, 1, 5, 0, 10], [0, 1, 1, 3, 9], [1, 2, 2, 4, 5]], 0, 2, 0]
    expected: 6
    relative: 0
    tolerance: 0
  - function: temporal_route
    args: [3, [[0, 1, 1, 0, 10], [1, 0, 1, 0, 10]], 0, 2, 0]
    expected: null
    relative: 0
    tolerance: 0
  - function: temporal_route
    args: [5, [[0, 1, 1, 0, 10], [1, 2, 1, 0, 10], [2, 3, 1, 0, 10], [3, 4, 1, 0, 10]], 0, 4, 0]
    expected: 4
    relative: 0
    tolerance: 0
  max_tokens: 4096
- id: AC2-02
  category: Advanced Coding
  difficulty: expert
  source: challenge-v2
  description: Sweep-line interval multiplicity with half-open endpoints and coalescing
  prompt: |
    Implement interval_overlay(intervals), where each interval is [start,end) with
        integer endpoints and start<=end. Return sorted maximal segments [start,end,count]
        with count>0 showing how many input intervals cover each point. Duplicates count
        separately. Ignore empty intervals. Adjacent segments with equal counts MUST merge,
        including across coincident starts and ends. Negative endpoints are allowed.
        Support up to 2000 intervals; return [] for no covered points.

    Return only Python code defining the function. Standard library only.
  evaluator: code_exec
  expected:
  - function: interval_overlay
    args: [[]]
    expected: []
    relative: 0
    tolerance: 0
  - function: interval_overlay
    args: [[[1, 4], [2, 5], [4, 7]]]
    expected: [[1, 2, 1], [2, 5, 2], [5, 7, 1]]
    relative: 0
    tolerance: 0
  - function: interval_overlay
    args: [[[0, 2], [2, 4]]]
    expected: [[0, 4, 1]]
    relative: 0
    tolerance: 0
  - function: interval_overlay
    args: [[[1, 3], [1, 3], [2, 2]]]
    expected: [[1, 3, 2]]
    relative: 0
    tolerance: 0
  - function: interval_overlay
    args: [[[-5, -1], [-3, 2], [0, 0]]]
    expected: [[-5, -3, 1], [-3, -1, 2], [-1, 2, 1]]
    relative: 0
    tolerance: 0
  - function: interval_overlay
    args: [[[0, 10], [2, 4], [4, 6], [6, 8]]]
    expected: [[0, 2, 1], [2, 8, 2], [8, 10, 1]]
    relative: 0
    tolerance: 0
  - function: interval_overlay
    args: [[[0, 1], [3, 4]]]
    expected: [[0, 1, 1], [3, 4, 1]]
    relative: 0
    tolerance: 0
  - function: interval_overlay
    args: [[[1, 1], [2, 2]]]
    expected: []
    relative: 0
    tolerance: 0
  max_tokens: 4096
- id: AC2-03
  category: Advanced Coding
  difficulty: expert
  source: challenge-v2
  description: Dependency levels with cycles and downstream blocked nodes
  prompt: |
    Implement dependency_batches(nodes, edges). nodes is a list of distinct strings;
        edges contains [prerequisite,dependent] pairs referring to those nodes. Duplicate
        edges and self-loops are allowed. At each round remove ALL currently zero-incoming
        nodes simultaneously, sorted lexicographically. Their removal takes effect only
        for the next round. Return {"batches": list of rounds, "blocked": sorted nodes
        remaining when no progress is possible}. Blocked includes downstream dependents
        of cycles, not just cycle members. Empty input returns both arrays empty.

    Return only Python code defining the function. Standard library only.
  evaluator: code_exec
  expected:
  - function: dependency_batches
    args: [[], []]
    expected: {batches: [], blocked: []}
    relative: 0
    tolerance: 0
  - function: dependency_batches
    args: [[a, b, c, d], [[a, c], [b, c], [c, d]]]
    expected: {batches: [[a, b], [c], [d]], blocked: []}
    relative: 0
    tolerance: 0
  - function: dependency_batches
    args: [[a, b, c, d, e], [[a, b], [b, a], [b, c], [d, e]]]
    expected: {batches: [[d], [e]], blocked: [a, b, c]}
    relative: 0
    tolerance: 0
  - function: dependency_batches
    args: [[x, y], [[x, x], [x, y]]]
    expected: {batches: [], blocked: [x, y]}
    relative: 0
    tolerance: 0
  - function: dependency_batches
    args: [[z, a, m], []]
    expected: {batches: [[a, m, z]], blocked: []}
    relative: 0
    tolerance: 0
  - function: dependency_batches
    args: [[a, b], [[a, b], [a, b]]]
    expected: {batches: [[a], [b]], blocked: []}
    relative: 0
    tolerance: 0
  - function: dependency_batches
    args: [[a], []]
    expected: {batches: [[a]], blocked: []}
    relative: 0
    tolerance: 0
  max_tokens: 4096
- id: AC2-04
  category: Advanced Coding
  difficulty: expert
  source: challenge-v2
  description: Event-time reads with late data, tie resolution, and tombstones
  prompt: |
    Implement versioned_read(events, queries). Each event is [key,timestamp,value],
        with a string key, integer timestamp, and JSON value. Events may arrive out of
        timestamp order. A null value is a deletion tombstone. For each [key,time] query,
        choose the event for that key with greatest timestamp <= time; when timestamps
        tie, choose the LAST occurrence in the input events. Return its value, or None
        if absent or tombstoned. A tombstone must not reveal an older value. Queries are
        independent and output order matches query order. Support 2000 events/queries.

    Return only Python code defining the function. Standard library only.
  evaluator: code_exec
  expected:
  - function: versioned_read
    args: [[], [[x, 0]]]
    expected: [null]
    relative: 0
    tolerance: 0
  - function: versioned_read
    args: [[[k, 5, late], [k, 1, early], [k, 3, null]], [[k, 0], [k, 1], [k, 3], [k, 4], [k, 5]]]
    expected: [null, early, null, null, late]
    relative: 0
    tolerance: 0
  - function: versioned_read
    args: [[[x, 2, a], [x, 2, null], [x, 1, old]], [[x, 2], [x, 1]]]
    expected: [null, old]
    relative: 0
    tolerance: 0
  - function: versioned_read
    args: [[[a, -1, false], [b, 0, 0], [a, 2, &id001 []]], [[a, -1], [b, 0], [a, 2], [c, 99]]]
    expected: [false, 0, *id001, null]
    relative: 0
    tolerance: 0
  - function: versioned_read
    args: [[[k, 3, a], [k, 3, b], [k, 3, c]], [[k, 3], [k, 2], [k, 9]]]
    expected: [c, null, c]
    relative: 0
    tolerance: 0
  - function: versioned_read
    args: [[[a, 1, &id002 {x: [1, 2]}]], [[a, 1]]]
    expected: [*id002]
    relative: 0
    tolerance: 0
  - function: versioned_read
    args: [[], []]
    expected: []
    relative: 0
    tolerance: 0
  max_tokens: 4096
- id: AC2-05
  category: Advanced Coding
  difficulty: expert
  source: challenge-v2
  description: Shortest qualifying subarray with negative numbers and deterministic ties
  prompt: |
    Implement shortest_subarray(nums, target) returning [start,end] (zero-based,
        end exclusive) of a NONEMPTY contiguous subarray with sum >= target.
        Minimize length, then start index. Return [-1,-1] if impossible. nums may contain
        negative numbers and zeros, and target may be negative or zero. Empty subarrays
        are never candidates. Support arrays up to length 2000. Empty input is allowed.

    Return only Python code defining the function. Standard library only.
  evaluator: code_exec
