    - type: regex
      value: \A(?:[^\n]*\n){2}Dawn\b[^\n]*\bgates[.!?]?(?:\n|$)
    - type: regex
      value: \A(?:[^\n]*\n){3}Home\b[^\n]*\bechoes[.!?]?(?:\n|$)
  max_tokens: 16384
