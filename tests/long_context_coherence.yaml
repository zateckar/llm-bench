# Long Context Coherence Test Suite

- id: LC-01
  category: Long Context Coherence
  prompt: |
    Read this document carefully and answer the question.

    PROJECT NEXUS - Technical Specification v2.3

    1. Overview: Project Nexus is a real-time analytics platform. The system processes 10M events/second. Primary language: Rust. Secondary: Python for ML pipelines.

    2. Architecture: Three-tier design. Frontend uses React 18 with TypeScript. Backend is Rust with Actix-web 4.0. Database: PostgreSQL 15 with TimescaleDB extension. Cache layer: Redis 7.0 with 64GB allocation.

    3. Team: Project lead is Maria Chen (joined March 2024). Backend team: 4 engineers (Alex, Jordan, Sam, Riley). Frontend: 2 engineers (Casey, Morgan). DevOps: 1 engineer (Taylor). ML team: 2 engineers (Quinn, Avery).

    4. Timeline: Phase 1 (Q1): Core ingestion pipeline. Phase 2 (Q2): Dashboard UI. Phase 3 (Q3): ML anomaly detection. Phase 4 (Q4): Mobile SDK.

    5. Budget: Total $2.4M. Infrastructure: $800K. Salaries: $1.2M. Tools/licenses: $200K. Contingency: $200K.

    6. Technical Debt: The auth module uses bcrypt with cost factor 12 (should be 14). The event parser has a known O(n²) bug for payloads >10MB. Redis eviction policy is set to 'volatile-lru' but should be 'allkeys-lru'.

    7. Decisions Log: Switched from MongoDB to PostgreSQL (May 2024). Adopted Actix-web over Axum (June 2024). Chose TimescaleDB over InfluxDB (July 2024).

    Question: Who is responsible for the ML anomaly detection work in Phase 3, and what database change was made that supports time-series data for this feature?
  evaluator: contains_keywords
  expected: ["quinn", "avery", "timescaledb"]

- id: LC-02
  category: Long Context Coherence
  prompt: |
    Read this contract excerpt and answer.

    SERVICE AGREEMENT between TechCorp Inc. (Provider) and DataFlow Ltd. (Client)
    Effective Date: January 15, 2024

    Section 1: Scope
    Provider shall deliver cloud infrastructure management services including:
    - 24/7 monitoring of production systems
    - Incident response within 15 minutes (Priority 1)
    - Monthly security audits
    - Quarterly capacity planning reviews

    Section 2: Pricing
    - Base fee: $25,000/month
    - On-call premium: $5,000/month
    - Additional incidents beyond 10/month: $500 each
    - Holiday coverage: 150% of base rate

    Section 3: SLA Terms
    - Uptime guarantee: 99.95%
    - Response time SLA: 15 minutes for P1, 4 hours for P2
    - Resolution time SLA: 4 hours for P1, 24 hours for P2
    - SLA credit: 10% of monthly fee per 0.1% below 99.95% uptime

    Section 4: Termination
    - Either party may terminate with 60 days written notice
    - Early termination fee: 3 months of base fees
    - Provider retains data for 30 days after termination

    Question: If DataFlow wants to terminate the contract immediately on March 1, 2024, how much would they owe in early termination fees, and what happens to their data?
  evaluator: contains_keywords
  expected: ["75,000", "30 days"]

