{% extends "base.html" %}
{% block title %}Benchmark Progress - LLM Bench{% endblock %}

{% block content %}
<div class="space-y-6" x-data="progressTracker()">
    <div class="flex items-center gap-4">
        <a href="/admin/run" class="text-slate-400 hover:text-white">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-white">Benchmark Progress</h1>
            <p class="text-slate-400 mt-1">Run #{{ run.id }}</p>
        </div>
    </div>

    <div class="card p-6">
        <div class="flex items-center justify-between mb-4">
            <div>
                <p class="text-sm text-slate-400" x-text="statusMessage || 'Waiting for benchmark to start...'"></p>
                <p class="text-lg font-semibold text-white mt-1" x-text="currentTest || '-'"></p>
            </div>
            <div class="text-right">
                <p class="text-3xl font-bold text-white" x-text="currentIndex + '/' + total"></p>
                <p class="text-xs text-slate-500">questions</p>
            </div>
        </div>

        <div class="progress-bar h-3">
            <div class="progress-fill" :style="'width: ' + (total > 0 ? (currentIndex / total * 100) : 0) + '%'"></div>
        </div>
        <p class="text-sm text-slate-500 mt-2" x-text="total > 0 ? Math.round(currentIndex / total * 100) + '%' : '0%'"></p>
    </div>

    <div x-show="done" class="card p-6">
        <div class="text-center">
            <template x-if="finalStatus === 'completed'">
                <div>
                    <div class="w-16 h-16 bg-emerald-900/50 rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </div>
                    <h2 class="text-xl font-bold text-white">Benchmark Complete!</h2>
                    <a href="/runs/{{ run.id }}" class="mt-4 inline-block btn-primary">View Results</a>
                </div>
            </template>
            <template x-if="finalStatus === 'failed'">
                <div>
                    <div class="w-16 h-16 bg-red-900/50 rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg class="w-8 h-8 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l2-2m-2 2l-2-2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </div>
                    <h2 class="text-xl font-bold text-white">Benchmark Failed</h2>
                    <a href="/runs/{{ run.id }}" class="mt-4 inline-block btn-primary">View Details</a>
                </div>
            </template>
        </div>
    </div>

    <div x-show="done" class="text-center text-sm text-slate-500">
        <span x-text="'Redirecting in ' + countdown + 's...'"></span>
    </div>
</div>

<script>
    function progressTracker() {
        return {
            currentTest: '',
            currentIndex: 0,
            total: 0,
            statusMessage: '',
            done: false,
            finalStatus: '',
            countdown: 5,

            init() {
                const evtSource = new EventSource('/admin/run/{{ run.id }}/stream');

                evtSource.addEventListener('progress', (e) => {
                    const data = JSON.parse(e.data);
                    this.currentTest = data.current_test || this.currentTest;
                    this.currentIndex = data.current_index ?? this.currentIndex;
                    this.total = data.total ?? this.total;
                    this.statusMessage = data.status_message || this.statusMessage;
                });

                evtSource.addEventListener('done', (e) => {
                    const data = JSON.parse(e.data);
                    this.done = true;
                    this.finalStatus = data.status;
                    evtSource.close();

                    const interval = setInterval(() => {
                        this.countdown--;
                        if (this.countdown <= 0) {
                            clearInterval(interval);
                            window.location.href = '/runs/{{ run.id }}';
                        }
                    }, 1000);
                });

                evtSource.onerror = () => {
                    // SSE will auto-reconnect
                };
            }
        };
    }
</script>
{% endblock %}
