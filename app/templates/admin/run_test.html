{% extends "base.html" %}
{% block title %}Run Benchmark - LLM Bench{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div>
        <h1 class="text-2xl font-bold text-white">Run Benchmark</h1>
        <p class="text-slate-400 mt-1">Start a new benchmark run against an LLM model</p>
    </div>

    {% if not models %}
    <div class="card p-8 text-center">
        <p class="text-slate-400">No models configured yet.</p>
        <a href="/admin/models" class="mt-3 inline-block text-sm text-blue-400 hover:text-blue-300">Add a model</a>
    </div>
    {% else %}
    <form method="POST" action="/admin/run" class="card p-6 space-y-5">
        <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Model</label>
            <select name="model_id" required class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                {% for model in models %}
                <option value="{{ model.id }}">{{ model.name }} ({{ model.model_id }})</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Category Filter</label>
            <select name="category" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                <option value="">All Categories</option>
                <option value="Factual Knowledge">Factual Knowledge</option>
                <option value="Mathematical Reasoning">Mathematical Reasoning</option>
                <option value="Logical Reasoning">Logical Reasoning</option>
                <option value="Code Generation">Code Generation</option>
                <option value="Instruction Following">Instruction Following</option>
                <option value="Truthfulness">Truthfulness</option>
                <option value="Reading Comprehension">Reading Comprehension</option>
                <option value="Tool Using">Tool Using</option>
                <option value="Long Context Coherence">Long Context Coherence</option>
                <option value="Agentic Use Cases">Agentic Use Cases</option>
                <option value="Advanced Coding">Advanced Coding</option>
                <option value="Security">Security</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Question Limit</label>
            <input type="number" name="limit" value="0" min="0"
                   class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500"
                   placeholder="0 = no limit">
            <p class="text-xs text-slate-500 mt-1">Set to 0 to run all questions</p>
        </div>

        <button type="submit" class="btn-primary w-full">Start Benchmark</button>
    </form>
    {% endif %}
</div>
{% endblock %}
